_run_: true
checkpoint_config:
  slurm_array_task_id: 0
cluster_switch:
  eval_path_c4: /storage_nvme_1/llm-random/datasets/c4/validation
  eval_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train
  train_path_c4: /storage_nvme_1/llm-random/datasets/c4/train
  train_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train
common:
  _target_: src.definitions.Common
  batch_size: 128
  data_seed: 123
  datt: 768
  dff: 1920
  dmodel: 768
  head_norm: true
  init_scale: 0.1
  init_type: truncated_normal_fixed
  kv_heads: 12
  model_seed: 123
  model_type: gpt
  n_blocks: 12
  q_heads: 12
  sequence_length: 512
  tokenizer: gpt2
  vocab_size: 50304
evaluator: null
infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: 1
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: test_decay_moe
    new_wandb_job: true
    project_name: llm-random-test
    tags:
    - nano
    - test_decay_moe
    - moe
    type: wandb
    wandb_entity: ideas_cv
  script:
  - 'export WANDB_API_KEY="__WANDB_API_KEY_PLACEHOLDER__"

    export HF_TOKEN="__HF_TOKEN_PLACEHOLDER__"'
  - export PROJECT_HOME_PATH=/storage_nvme_4/nano/$USER
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=$PROJECT_HOME_PATH/pixi
  - export HF_HOME=$PROJECT_HOME_PATH/hf_cache
  - export PATH="$HOME/.pixi/bin:$PATH"
  - export HF_DATASETS_TRUST_REMOTE_CODE=1
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: entropy
  slurm:
    cpus_per_gpu: 14
    gres: gpu:2
    job-name: test_decay_moe
    mem_per_gpu: 90G
    nodes: 1
    partition: h100
    time: 00:30:00
model:
  _target_: src.core.model.LLM
  embedding:
    _target_: src.core.model.TransformerEmbedding
    dmodel: 768
    init_fn:
      _partial_: true
      _target_: src.core.model.trunc_normal_
    vocab_size: 50304
  encoder:
    _target_: src.core.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.core.model.TransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.core.model.RoPEAttention
        compile: false
        dmodel: 768
        k_proj_fn:
          _partial_: true
          _target_: src.core.model.Linear
          in_features: 768
          out_features: 768
          partial_init_fn:
            _partial_: true
            _target_: src.core.model.trunc_normal_init
            scale: 0.1
        kv_heads: 12
        o_proj_fn:
          _partial_: true
          _target_: src.core.model.Linear
          in_features: 768
          out_features: 768
          partial_init_fn:
            _partial_: true
            _target_: src.core.model.trunc_normal_init
            scale: 0.1
        pre_attn_fn:
          _partial_: true
          _target_: src.core.model.QKNorm
          k_norm_fn:
            _partial_: true
            _target_: src.core.model.RMSNorm
            eps: 1.0e-06
            normalized_shape: 64
          q_norm_fn:
            _partial_: true
            _target_: src.core.model.RMSNorm
            eps: 1.0e-06
            normalized_shape: 64
        q_heads: 12
        q_proj_fn:
          _partial_: true
          _target_: src.core.model.Linear
          in_features: 768
          out_features: 768
          partial_init_fn:
            _partial_: true
            _target_: src.core.model.trunc_normal_init
            scale: 0.1
        rope_base: 500000
        rope_scale_freqs: true
        seq_len: 512
        v_proj_fn:
          _partial_: true
          _target_: src.core.model.Linear
          in_features: 768
          out_features: 768
          partial_init_fn:
            _partial_: true
            _target_: src.core.model.trunc_normal_init
            scale: 0.1
      ff_layer_fn:
        _partial_: true
        _target_: src.core.moe.MoE
        activation_function: swiglu
        capacity_factor: 1.25
        dff: 1920
        dmodel: 768
        init_scale: 0.1
        moe_load_balancing_loss_factor: 0.01
        moe_router_z_loss_factor: 0.001
        normalize_router_logits: false
        num_experts: 4
        topk: 1
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-05
        normalized_shape: 768
    n_blocks: 12
  head:
    _target_: src.core.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.core.model.Linear
      in_features: 768
      out_features: 50304
      partial_init_fn:
        _partial_: true
        _target_: src.core.model.trunc_normal_init
        scale: 0.1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-05
      normalized_shape: 768
overrides: []
simpleP:
  base_dmodel: 256
trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: null
      reset_scheduler: false
      rewind_data: false
      training_state_filename: null
      type: nano
    save:
      interval: 100
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /storage_nvme_4/nano/models
      training_state_filename: __training_state_filename.pt
      type: nano
  distributed:
    fsdp2:
      modules_to_shard:
      - src.core.model.TransformerEmbedding
      - src.core.model.TransformerBlock
      - src.core.model.TransformerHead
  eval_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.C4Dataset
      path: /storage_nvme_1/llm-random/datasets/c4/validation
      seed: 123
      sequence_length: 512
      shuffle: true
      split: validation
      tokenize_fn:
        _target_: src.core.datasets.gpt2_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 8
    total_batch_size: 128
  eval_interval: 100
  final_lm_eval: false
  gradient_accumulation_steps: 1
  gradient_clipping: 1
  learning_rate: 9
  lm_eval_interval: 0
  n_eval_steps: 10
  n_steps: 1001
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.WSDScheduler
    decay_steps: 100
    n_steps: 1001
    warmup_steps: 10
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.C4Dataset
      path: /storage_nvme_1/llm-random/datasets/c4/train
      seed: 123
      sequence_length: 512
      shuffle: true
      split: train
      tokenize_fn:
        _target_: src.core.datasets.gpt2_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 8
    total_batch_size: 128
  weight_decay: 0.1
