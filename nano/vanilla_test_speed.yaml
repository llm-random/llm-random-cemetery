defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
      # - trainer
    - configs/defaults/model_sizes:
      - k8
    - _self_

model:
  common:
    sequence_length: 256

training:
  dataloader:
    total_batch_size: 256
    eval_dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
    training_dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"

  n_steps: 10001
  learning_rate: 1e-3


  scheduler: 
    config:
      warmup_steps: 100



##### INFRASTRUCTURE #####

slurm:
  job-name: "dl_speed_test"
  gres: gpu:1
  time: 0-06:00:00
  partition: a100
  # ntasks-per-node: 2

checkpoint_config:
    interval: 0
    path: "/storage_nvme_1/crewtool/checkpoints/speed_test"


venv_path: '$HOME/onefiler/venv/bin/activate'

server: entropia

metric_logger:
  name: "st"
  tags: 
    - "nano"
    - "speed_test"



trainer_factory: 
    _target_: model.Trainer
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 4
        seed: ${random_seed:}
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: model.trunc_collate
            _partial_: true
            seq_len: ${model.common.sequence_length}
            batch_size: 256


    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
        dataset_split: "validation"
        total_batch_size: 256
        sequence_length: ${model.common.sequence_length}
        num_workers: 4
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false