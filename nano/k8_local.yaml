checkpoint_config:
    path: "ckpts"


# venv_path: '$HOME/onefiler/venv/bin/activate'

# server: entropia

metric_logger:
  project_name: "crewtool/mojtestproject"
  name: "xd"
  tags: 
    - "nano"
    - "k8"
    - vanilla


trainer_factory: 
    train_dataloader:
        dataset_path: "data"
        total_batch_size: 4
        sequence_length: 13
        num_workers: 0
        shuffle: false
        collate_fn: 
            _target_: token_reduction.model.collate_trunc_reduction
            _partial_: true
            trunc_seq_len: ${eval:'${model.common.sequence_length} + ${model.common.dropped_tokens} + 1'}
            result_seq_len: ${model.common.sequence_length}
            trunc_batch_size: 2
            n_dropped_tokens: ${model.common.dropped_tokens}


    eval_dataloader:
        dataset_path: "data_eval"
        total_batch_size: 4
        sequence_length: 4
        num_workers: 0
        seed: 123
        shuffle: false