defaults:
    - k8_merge
    - _self_

model:
  common:
    sequence_length: 8
    dropped_tokens: 3

training:

  n_steps: 100
  ^learning_rate: [2e-3, 5e-3, 1e-3]


  scheduler: 
    config:
      warmup_steps: 10



