defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k8
    - _self_

model:
  _target_: token_reduction.model.LLM_MTP    
  common:
    ^sequence_length: [512, 704]

  mtp_config:
      _target_: token_reduction.model.MTPConfig
      n_mtp: 1
      mtp_block_config: ${model.tower_config.block_config}

training:
  gradient_accumulation_steps: 4
  n_steps: 12501
  ^learning_rate: [1e-3, 2e-3, 5e-3]


  scheduler: 
    config:
      warmup_steps: 125



##### INFRASTRUCTURE #####

slurm:
  job-name: "k8mtp"
  gres: gpu:1
  time: 0-10:00:00
  partition: a100
  cpus-per-task: 32
  mem_per_gpu: 125G
  nodes: 1
  # ntasks-per-node: 2

checkpoint_config:
    interval: 0
    path: "/storage_nvme_1/crewtool/checkpoints/mtpsimple"


venv_path: '$HOME/onefiler/venv/bin/activate'

server: entropia

metric_logger:
  name: "k8_mtp"
  tags: 
    - "nano"
    - "k8"
    - vanilla


trainer_factory: 
    _target_: token_reduction.model.TrainerMTP
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 32
        # ^seed: [10001, 10002, 10003]
        seed: 10001
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: token_reduction.model.trunc_collate
            _partial_: true
            seq_len: ${eval:'${model.common.sequence_length} + ${model.mtp_config.n_mtp} + 1'}
            batch_size: 512

    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
        dataset_split: "validation"
        total_batch_size: 512
        sequence_length: 512
        num_workers: 8
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false