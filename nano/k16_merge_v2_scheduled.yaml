defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}

    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k16
    - _self_

model:
  embedding:
      _target_: token_reduction.model.TokenMergingEmbedding
      normal_embedding:
          _target_: token_reduction.model.get_dropping_standard_embedding
          sequence_length: ${model.common.sequence_length}
          dmodel: ${model.common.dmodel}
          init_type: ${model.common.init_type}
          init_scale: ${model.common.init_scale}
          vocab_size: ${model.common.vocab_size}
          reduction_tokens: ${model.common.dropped_tokens}
      common: ${model.common}
  common:
    _target_: token_reduction.model.CommonDroppingConfig
    sequence_length: 256
    # dropped_tokens: 32
    ^dropped_tokens: [32, 64, 96]

training:

  n_steps: 200001
  ^learning_rate: [2e-4, 3.5e-4]


  scheduler: 
    config:
      warmup_steps: 2000



metric_logger:
  name: "test_merge_v2"
  tags: 
    - "nano"
    - "k8"
    - "vanilla"
    - "merge"
    - "scheduled"
  new_neptune_job: true



trainer_factory: 
    _target_: token_reduction.model.TrainerMerge
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}
    n_reduced_tokens: ${model.common.dropped_tokens}
    sequence_length: ${model.common.sequence_length}


    token_reducing_scheduler:
      _target_: token_reduction.model.ReductionScheduler      
      schedule_config:
          - type: constant
            percentage: 0.75
            start_scale: 1.0
            end_scale: 1.0
          - type: constant
            percentage: 0.25
            start_scale: 0.0
            end_scale: 0.0
      total_steps: ${training.n_steps}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 32
        seed: 10005
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: token_reduction.model.trunc_collate
            _partial_: true
            seq_len: ${eval:'${model.common.sequence_length} + ${model.common.dropped_tokens} + 1'}
            batch_size: 256

    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
        dataset_split: "validation"
        total_batch_size: 256
        sequence_length: 256
        num_workers: 4
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false


##### INFRASTRUCTURE #####

slurm:
  job-name: "k8_merge_v2"
  gres: gpu:1
  time: 0-03:00:00
  partition: a100
  cpus-per-task: 32
  mem_per_gpu: 125G
  nodes: 1
  # ntasks-per-node: 2

checkpoint_config:
    interval: 50000
    save_path: "/storage_nvme_1/crewtool/checkpoints/k16/10005_simple_merge"
    # load_path: "/storage_nvme_1/crewtool/checkpoints/k16/10005_simple_merge/0/step_37500"


venv_path: '$HOME/onefiler/venv/bin/activate'

server: entropia

