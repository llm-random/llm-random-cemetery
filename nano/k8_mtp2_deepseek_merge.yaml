    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 32
        # ^seed: [10001, 10002, 10003]
        seed: 10001
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: token_reduction.model.trunc_collate
            _partial_: true
            seq_len: ${eval:'${model.common.sequence_length} + ${model.mtp_config.n_mtp} + ${model.common.dropped_tokens} + 1'}
            batch_size: 256

    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
        dataset_split: "validation"
        total_batch_size: 256
        sequence_length: 256
        num_workers: 4
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false


##### INFRASTRUCTURE #####

slurm:
  job-name: "k8mtp_merge"
  gres: gpu:1
  time: 0-10:00:00
  partition: a100
  cpus-per-task: 32
  mem_per_gpu: 125G
  nodes: 1
  # ntasks-per-node: 2

checkpoint_config:
    interval: 12500
    # load_path: "/storage_nvme_1/crewtool/checkpoints/deepseek/7/step_40000"
    # save_path: "/storage_nvme_1/crewtool/checkpoints/tutaj_inny_run_2_schedule_go"
    save_path: "/storage_nvme_1/crewtool/checkpoints/96_schedule_go_k8_mtp_deepseek_merge"


venv_path: '$HOME/onefiler/venv/bin/activate'

server: entropia

