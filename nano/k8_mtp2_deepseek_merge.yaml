defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k8
    - _self_

model:
  _target_: token_reduction.model.LLM_DeepSeekMTP   
  embedding:
      _target_: token_reduction.model.TokenMergingEmbedding
      normal_embedding:
          _target_: token_reduction.model.get_dropping_standard_embedding
          sequence_length: ${eval:'${model.common.sequence_length} + ${model.mtp_config.n_mtp}'}
          dmodel: ${model.common.dmodel}
          init_type: ${model.common.init_type}
          init_scale: ${model.common.init_scale}
          vocab_size: ${model.common.vocab_size}
          reduction_tokens: ${model.common.dropped_tokens}
      common: ${model.common}
  common:
    _target_: token_reduction.model.CommonDroppingConfig
    # dropped_tokens: 1
    # ^dropped_tokens: [32, 64, 96]
    dropped_tokens: 96
    ^sequence_length: [256]

  mtp_config:
      _target_: token_reduction.model.MTPConfig
      n_mtp: 1
      mtp_block_config: ${model.tower_config.block_config}

training:

  n_steps: 50001
  # ^learning_rate: [5e-4, 1e-3, 2e-3]
  learning_rate: 1e-3


  scheduler: 
    config:
      warmup_steps: 500


metric_logger:
  name: "k8_mtp_deepseek_merge_scheduled"
  tags: 
    - "nano"
    - "k8"
    - "mtp"
    - "deepseek"
    - "merge"
  new_neptune_job: true



trainer_factory: 
    _target_: token_reduction.model.TrainerDeepSeekMTPMerge
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}
    mtp_lambda: 0.6
    n_reduced_tokens: ${model.common.dropped_tokens}
    sequence_length: ${model.common.sequence_length}
