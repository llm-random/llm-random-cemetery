defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k24
    - _self_

model:
  common:
    sequence_length: 512

training:
  # gradient_accumulation_steps: 
  n_steps: 125001
  ^learning_rate: [5e-4, 3.5e-4, 2e-4]
  # learning_rate: 5e-4


  scheduler: 
    config:
      warmup_steps: 1250



##### INFRASTRUCTURE #####

# slurm:
#   job-name: "comp"
#   gres: gpu:1
#   time: "2-00:00:00"
#   partition: h100
#   cpus-per-task: 32
#   mem_per_gpu: 125G
#   nodes: 1
#   # ntasks-per-node: 2

slurm:
  gres: gpu:4
  time: "2-00:00:00"
  partition: "plgrid-gpu-gh200"
  cpus-per-gpu: "72"
  mem-per-gpu: "100G"
  account: "plgllmefficont2-gpu-gh200"
  nodes: 1
  ntasks-per-node: 4

checkpoint_config:
    interval: 125000
    path: "/net/storage/pr3/plgrid/plggllmeffi/crewtool_checkpoints/vanilla_with_hn"


server: mojhelios

metric_logger:
  name: "tuning"
  tags: 
    - "nano"
    - "k24"
    - vanilla


trainer_factory: 
    _target_: model.Trainer
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/net/scratch/hscra/plgrid/plgmaciejpioro/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 32
        seed: 10001
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: token_reduction.model.trunc_collate
            _partial_: true
            seq_len: ${model.common.sequence_length}
            batch_size: 512


    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/net/scratch/hscra/plgrid/plgmaciejpioro/c4/validation"
        dataset_split: "validation"
        total_batch_size: 256
        sequence_length: 512
        num_workers: 4
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false



venv_path: '/net/storage/pr3/plgrid/plggllmeffi/venv_crew/bin/activate'
experiment_prepare_venv_path: /net/storage/pr3/plgrid/plggllmeffi/plgcrewtool/login_venv/bin/activate

cemetery_experiments_dir:  "/net/storage/pr3/plgrid/plggllmeffi/plgcrewtool/cemetery"