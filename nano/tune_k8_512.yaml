defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k8
    - _self_

model:
  common:
    sequence_length: 512

training:

  n_steps: 25000
  ^learning_rate: [5e-3, 2e-3, 1e-3]


  scheduler: 
    config:
      warmup_steps: 250



##### INFRASTRUCTURE #####

slurm:
  job-name: "comp"
  gres: gpu:1
  time: 0-06:00:00
  partition: a100
  cpus-per-task: 32
  mem_per_gpu: 125G
  nodes: 1
  # ntasks-per-node: 2

checkpoint_config:
    interval: 0
    path: "/storage_nvme_1/crewtool/checkpoints/speed_test"


venv_path: '$HOME/onefiler/venv/bin/activate'

server: entropia

metric_logger:
  name: "tune"
  tags: 
    - "nano"
    - "k8"
    - vanilla
    # - lr=2e-3


trainer_factory: 
    _target_: model.Trainer
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 32
        seed: 10001
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: token_reduction.model.trunc_collate
            _partial_: true
            seq_len: ${model.common.sequence_length}
            batch_size: 512


    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
        dataset_split: "validation"
        total_batch_size: 256
        sequence_length: 256
        num_workers: 4
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false