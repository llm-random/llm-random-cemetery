defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k16
    - _self_

model:
  common:
    ^sequence_length: [256]

training:
  gradient_accumulation_steps: 4
  n_steps: 200001
  # ^learning_rate: [2e-4,3.5e-4]
  ^learning_rate: [5e-4, 1e-3]


  scheduler: 
    config:
      warmup_steps: 2000



##### INFRASTRUCTURE #####

slurm:
  job-name: "comp"
  gres: gpu:1
  time: "2-00:00:00"
  partition: h100
  cpus-per-task: 32
  mem_per_gpu: 125G
  nodes: 1
  # ntasks-per-node: 2

checkpoint_config:
    interval: 0
    path: "/storage_nvme_1/crewtool/checkpoints/k16/tutaj_k161e35e4"


venv_path: '$HOME/onefiler/venv/bin/activate'

server: entropia

metric_logger:
  name: "k16_seq_len_1375"
  tags: 
    - "nano"
    - "k16"
    - vanilla
    - lr=2e-4
    - "increase"


trainer_factory: 
    _target_: model.Trainer
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        dataset_split: "train"
        total_batch_size: 1024
        sequence_length: 1024
        num_workers: 32
        seed: 10001
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false
        collate_fn: 
            _target_: token_reduction.model.trunc_collate
            _partial_: true
            seq_len: ${eval:'${model.common.sequence_length} + 1'}
            batch_size: 256


    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"
        dataset_split: "validation"
        total_batch_size: 256
        sequence_length: 256
        num_workers: 4
        seed: 123
        shuffle: true
        use_new_sampling_method: true
        world_size_independent: false