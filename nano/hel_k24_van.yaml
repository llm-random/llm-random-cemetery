defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - factories
      - infrastructure
      - metric_logger
      - model
      - training
    - configs/defaults/model_sizes:
      - k24
    - _self_

model:
  common:
    sequence_length: 512

training:
  dataloader:
    total_batch_size: 512
    training_dataset_path: "/net/scratch/hscra/plgrid/plgmaciejpioro/c4/train"
    eval_dataset_path: "/net/scratch/hscra/plgrid/plgmaciejpioro/c4/validation"
    num_workers: 4

  n_steps: 125001
  learning_rate: 1e-4


  scheduler: 
    config:
      warmup_steps: 1250


##### INFRASTRUCTURE #####

checkpoint_config:
    interval: 25000
    path: "/net/storage/pr3/plgrid/plggllmeffi/crewtool_checkpoints/tr_v_k24/1e4"

server: helios

metric_logger:
  name: "tr_v_k24_2e4"
  tags: 
    - "vanilla" 
    - "lr=1e-4"
    - "k24"


slurm:
  gres: gpu:4
  time: "2-00:00:00"
  partition: "plgrid-gpu-gh200"
  cpus-per-gpu: "72"
  mem-per-gpu: "100G"
  account: "plgllmefficont2-gpu-gh200"
  nodes: 1
  ntasks-per-node: 4
  job-name: "v_k24"


modules_to_add: 
  - "ML-bundle/24.06a"


cemetery_experiments_dir: "/net/storage/pr3/plgrid/plggllmeffi/tr_proba/cementery"


venv_path: '/net/storage/pr3/plgrid/plggllmeffi/venv_crew/bin/activate'

hydra:
  callbacks:
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  verbose:
      - __main__
      - model