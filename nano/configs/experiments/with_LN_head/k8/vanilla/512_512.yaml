# configs/experiments/with_LN_head/k8/vanilla/512_512.yaml
defaults:
  - /configs/clusters: ${__llmrandom_cluster_config:}
  - configs/experiments/with_LN_head/k8:
    - _k8_base
  - _self_


training:
  _target_: model.TrainingConfig
  n_steps: 8001
  gradient_accumulation_steps: 4

  scheduler: 
    _target_: model.get_cosine_scheduler_with_warmup
    _partial_: true
    config:        
      warmup_steps: 80

  dataloader:
    total_batch_size: 512

model:
  common:
    sequence_length: 512

metric_logger:
  type: "neptune"
  heavy_metrics_calculation_interval: 160
  project_name: "pmtest/llm-random"
  name: "nano_token_newgrid"
  tags: ["nano", "post_hln", "k8", "vanilla", "512_512"]

slurm:
  job-name: ${metric_logger.name}
  gres: gpu:${slurm.ntasks-per-node}
  ntasks-per-node: 1
  time: "12:00:00"
  partition: a100