defaults:
  - /configs/clusters: ${__llmrandom_cluster_config:}
  - /configs/defaults:
    - checkpoints
    - distributed
    - factories
    - infrastructure
    - metric_logger
    - training
    - model
  - _self_

training:
  _target_: model.TrainingConfig
  n_steps: 16001 #here
  # ^learning_rate: [5e-4, 1e-3, 2e-3, 5e-3]
  ^learning_rate: [5e-3]
  weight_decay: 0.1
  gradient_accumulation_steps: 2  #here
  seed: 53
  gradient_clipping: 1.0

  scheduler: 
    _target_: model.get_cosine_scheduler_with_warmup
    _partial_: true
    config:        
      warmup_steps: 160  #here
      n_steps: ${training.n_steps}
      final_lr_fraction: 0.1
      type: "cosine"

  dataloader:
    total_batch_size: 512 #here
    training_dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
    eval_dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"

model:
  common:
    sequence_length: 256  #here
    dff: 2048
    dmodel: 512
    head_norm: true
  tower_config:
    n_blocks: 8
    block_config:
      attention:
        n_heads: 8

checkpoint_config:
  interval: 0
  path: null

venv_path: '$HOME/llm-random/nano/venv/bin/activate' 
server: entropy

metric_logger:
  type: "neptune"
  heavy_metrics_calculation_interval: 160 #here
  project_name: "pmtest/llm-random"
  name: "nano_token_newgrid"
  tags: ["nano", "post_hln", "k8", "vanilla", "512_256"]  #here

slurm:
  job-name: ${metric_logger.name}
  gres: gpu:${slurm.ntasks-per-node}
  ntasks-per-node: 1
  time: "12:00:00"
  partition: a100