defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - training
    - configs/reduction_defaults:
      - merge_model
      - merge_factories
    - _self_

model:
  embedding:
      _target_: token_reduction.model.TokenMergingEmbeddingBothTokens

  tower_config:
    n_blocks: 2
    block_config:
      attention:
        n_heads: 2
  common:
    sequence_length: 23
    dff: 64
    dmodel: 8
    dropped_tokens: 5

slurm:
  gres: gpu:1
  time: 2-00:00:00


training:
  dataloader:
      total_batch_size: 20
  seed: ${random_seed:}
  n_steps: 200001
  learning_rate: 2e-4
  # ^gradient_clipping: [0.5, 1.0]
  gradient_clipping: 1.0

  scheduler: 
    config:
      warmup_steps: 2000

venv_path: '$HOME/onefiler/venv/bin/activate' 

server: entropia

checkpoint_config:
    interval: 20000
    # path: "/storage_ssd_1/crewtool/checkpoints/k16_both_0_1_1"