defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - factories
      - infrastructure
      - metric_logger
      - training
      - model
    - _self_

training:
    _target_: model.TrainingConfig
    n_steps: 40001
    ^learning_rate: [5e-4, 2e-4, 1e-4]
    weight_decay: 0.1
    gradient_accumulation_steps: 2
    seed: 53
    gradient_clipping: 1.0

    scheduler: 
        _target_: model.get_cosine_scheduler_with_warmup
        _partial_: true
        config:        
            warmup_steps: 1200
            n_steps: ${training.n_steps}
            final_lr_fraction: 0.1
            type: "cosine"

    dataloader:
        total_batch_size: 512
        training_dataset_path: "/storage_nvme_1/llm-random/datasets/c4/train"
        eval_dataset_path: "/storage_nvme_1/llm-random/datasets/c4/validation"

model:
  common:
    sequence_length: 512
    dff: 4096
    dmodel: 1024
    head_norm: false

  tower_config:
    n_blocks: 16
    block_config:
      attention:
        n_heads: 16

metric_logger:
    type: "neptune"
    heavy_metrics_calculation_interval: 800
    project_name: "pmtest/llm-random"
    name: "nano_head_norm"
    tags: ["nano", "head_norm_lrgrid", "k16", "hnorm=False"]

slurm:
    job-name: ${metric_logger.name}
    gres: gpu:${slurm.ntasks-per-node}
    ntasks-per-node: 2
    time: "48:00:00"
    partition: a100

checkpoint_config:
    interval: 0
    path: null

venv_path: '$HOME/llm-random/nano/venv/bin/activate' 
server: entropy