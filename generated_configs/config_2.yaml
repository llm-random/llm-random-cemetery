        normalized_shape: ${common.dmodel}

overrides:
- trainer.n_steps=4096

projected_compression:
  adjust_grad_norm: false
  init_norms_with_ones: false
  modules_to_shard:
  - src.projected_compression.mem_eff.CompressibleBlock
  - ${model.source_model.embedding._target_}
  - ${model.source_model.encoder.block_fn._target_}
  - ${model.source_model.head._target_}
  path_to_importances: /lustre/pd01/plgrid/plgllmefficont2/projected_compression/importances/8b/minitron_dimensions_importances.pt
  separate_block_optimizers: true
  source_model_for_distillation: false
  source_model_path: /lustre/pd01/plgrid/plgllmefficont2/projected_compression/hf_to_nano_converted/llama8b_in_nano.pt

trainer:
  _partial_: true
  _target_: src.projected_compression.trainer_distillation.PCDistillationTrainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: null
      training_state_filename: null
      type: nano
    save:
      interval: 0
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /lustre/pd03/plgrid/plgllmefficont3/mstefaniak/checkpoints/results
      training_state_filename: __training_state_filename.pt
      type: hf_only
  distillation_alpha: 0.5
  distillation_temperature: 1.0
  distributed:
    fsdp2: null
  eval_dataloader: None
  eval_interval: 0
  gradient_accumulation_steps: 16
  gradient_clipping: 0.25
  learning_rate: 15
  n_eval_steps: 10
  n_steps: 4096
  only_compress_model_gradient_clipping: false
  only_target_model_gradient_clipping: 1.0
  original_llama_path: meta-llama/Llama-3.1-8B
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 40
  teacher_distributed:
    fsdp2:
      modules_to_shard:
      - ${distillation.teacher_model.embedding._target_}
      - ${distillation.teacher_model.encoder.block_fn._target_}
      - ${distillation.teacher_model.head._target_}
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.FineWebEduDataset
      path: ${cluster_switch.train_path_fineweb}
      seed: 123
      sequence_length: ${common.sequence_length}
      shuffle: true
      split: train
      tokenize_fn:
        _target_: src.core.datasets.llama_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 2
    total_batch_size: ${common.batch_size}
  weight_decay: 0.1
