            partial_init_fn:
              _partial_: true
              _target_: src.projected_compression.model.llm_random_weight_init
              scale: 1
          rope_base: 1000000
          rope_scale_freqs: false
          seq_len: ${common.sequence_length}
          v_proj_fn: ${model.target_model.encoder.block_fn.attention_fn.k_proj_fn}
        ff_layer_fn:
