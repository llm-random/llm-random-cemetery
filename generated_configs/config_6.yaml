overrides:
- common.dmodel=960
- projected_compression.pc_weights_lr_ratio=0.03125
- trainer.n_steps=2048
- trainer.learning_rate=10

projected_compression:
  adjust_grad_norm: false
  cpu_offload_projections: false
  init_norms_with_ones: false
  modules_to_shard:
  - src.projected_compression.mem_eff.CompressibleBlock
  - ${model.source_model.embedding._target_}
  - ${model.source_model.encoder.block_fn._target_}
  - ${model.source_model.head._target_}
  path_to_importances: /lustre/pd03/plgrid/plgllmefficont3/plgj321m/pc/importances/qwen/1_7B/5403539/0/minitron_dimensions_importances.pt
  pc_weights_lr_ratio: 0.03125
  separate_block_optimizers: true
  source_model_for_distillation: false
  source_model_path: /lustre/pd03/plgrid/plgllmefficont3/plgj321m/pc/qwen3_1_7b_in_nano.pt

trainer:
  _partial_: true
  _target_: src.projected_compression.trainer.PCTrainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: null
      training_state_filename: null
      type: nano
    save:
      interval: 0
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /lustre/pd03/plgrid/plgllmefficont3/plgj321m/pc/checkpoints/pc/qwen/1_7B
      training_state_filename: __training_state_filename.pt
      type: hf_only
  distributed:
    fsdp2: null
  eval_dataloader: None
  eval_interval: 0
  gradient_accumulation_steps: 8
  gradient_clipping: 1.0
  learning_rate: 10
  n_eval_steps: 10
  n_steps: 2048
  only_compress_model_gradient_clipping: false
  only_target_model_gradient_clipping: 1.0
  original_llama_path: Qwen/Qwen3-1.7B-Base
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 40
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.FineWebEduDataset
      path: ${cluster_switch.train_path_fineweb}
      seed: 123
      sequence_length: ${common.sequence_length}
      shuffle: true
      split: train
      tokenize_fn:
        _target_: src.core.datasets.qwen_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 2
    total_batch_size: ${common.batch_size}
  weight_decay: 0.1
