_run_: true

apply_functions:
- _partial_: true
  _target_: src.core.olmo.verify_olmo_against_hf
  hf_path: ${trainer.checkpoint.load.path}
  vocab_size: ${model.embedding.vocab_size}

cluster_switch:
  eval_path_c4: /storage_nvme_1/llm-random/datasets/c4/validation
  eval_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train
  train_path_c4: /storage_nvme_1/llm-random/datasets/c4/train
  train_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train

common:
  _target_: src.definitions.Common
  dff: 8192
  dhead: 128
  dmodel: 2048
  kv_heads: 16
  n_blocks: 16
  q_heads: 16
  sequence_length: 4096

evaluator: null

infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: null
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: PC_save_pretrained_hf_to_nano
    new_wandb_job: true
    project_name: llm-random-test
    tags:
    - nano
    - pc
    - save_pretrained
    - olmo2
    type: wandb
    wandb_entity: ideas_cv
  script:
  - ${export_env_variables_placeholders:}
  - export PROJECT_HOME_PATH=/storage_nvme_4/nano
  - export HF_HOME=$PROJECT_HOME_PATH/hf_cache
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=$PROJECT_HOME_PATH/$USER/pixi
  - export PATH="$HOME/.pixi/bin:$PATH"
  - export XDG_DATA_HOME="$PIXI_HOME/data"
  - export XDG_CACHE_HOME="$PIXI_HOME/cache"
  - export XDG_STATE_HOME="$PIXI_HOME/state"
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: entropy
  slurm:
    cpus_per_gpu: 14
    gres: gpu:1
    job-name: ${infrastructure.metric_logger.name}
    mem_per_gpu: 90G
    nodes: 1
    partition: h100
    time: 0-01:00:00

init_model_opt_sched_fn:
  _partial_: true
  _target_: src.core.olmo.save_pretrained_olmo_as_nano

model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    dmodel: ${common.dmodel}
    init_fn:
      _partial_: true
      _target_: src.projected_compression.model.trunc_normal_
    vocab_size: 100352
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.projected_compression.model.OlmoTransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.projected_compression.model.OlmoAttention
        dmodel: ${common.dmodel}
        k_norm_fn:
          _partial_: true
          _target_: src.core.model.RMSNorm
          eps: 1.0e-06
          normalized_shape: ${eval:'${common.dhead} * ${common.kv_heads}'}
        k_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.kv_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        kv_heads: ${common.kv_heads}
        o_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        q_heads: ${common.q_heads}
        q_norm_fn:
          _partial_: true
          _target_: src.core.model.RMSNorm
          eps: 1.0e-06
          normalized_shape: ${eval:'${common.dhead} * ${common.q_heads}'}
        q_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        rope_base: 500000
        rope_scale_freqs: false
        seq_len: ${common.sequence_length}
        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}
      ff_layer_fn:
        _partial_: true
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        ff_post_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dff}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        ff_pre_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${common.dff}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-06
        normalized_shape: ${common.dmodel}
    n_blocks: ${common.n_blocks}
  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.projected_compression.model.Linear
      in_features: ${common.dmodel}
      out_features: ${model.embedding.vocab_size}
      partial_init_fn:
        _partial_: true
        _target_: src.projected_compression.model.llm_random_weight_init
        scale: 1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-06
      normalized_shape: ${common.dmodel}

overrides: []

trainer:
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: allenai/OLMo-2-0425-1B
      training_state_filename: null
      type: huggingface
    save:
      interval: -1
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /storage_nvme_4/nano/${oc.env:USER}/pc/olmo2_1b_in_nano.pt
      training_state_filename: __training_state_filename.pt
      type: nano
