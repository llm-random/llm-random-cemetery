_run_: true

cluster_switch:
  nano_user_dir: /raid/NFS_SHARE/home/${oc.env:USER}/nano_runs
  zephon_cache_dir: /raid/NFS_SHARE/home/${oc.env:USER}/zephon/fineweb_edu
  zephon_index_dir: /raid/NFS_SHARE/home/${oc.env:USER}/zephon/index

common:
  _target_: src.definitions.Common
  batch_size: 512
  datt: 2048
  dff: 8192
  dmodel: 2048
  head_norm: true
  init_scale: 0.1
  init_type: truncated_normal_fixed
  kv_heads: 8
  model_type: gpt
  n_blocks: 16
  q_heads: 32
  sequence_length: 1024
  vocab_size: 128256

evaluator: null

infrastructure:
  cemetery_experiments_dir: ${oc.select:infrastructure.cluster_cemetery_dir,'~/llmrandom_cemetery'}
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: null
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: bdd_llama1B_retrain_zephon_dgx
    new_wandb_job: true
    project_name: llm-random-test
    tags:
    - nano
    - bdd
    - llama_1
    - retrain
    - zephon
    - dgx
    type: wandb
    wandb_entity: ideas_cv
  script:
  - ${export_env_variables_placeholders:}
  - SECRETS_DIR=$HOME/.config/bdd/secrets
  - if [ -z "$WANDB_API_KEY" ] && [ -s "$SECRETS_DIR/wandb_api_key" ]; then export
    WANDB_API_KEY="$(cat "$SECRETS_DIR/wandb_api_key")"; fi
  - if [ -z "$HF_TOKEN" ] && [ -s "$SECRETS_DIR/hf_token" ]; then export HF_TOKEN="$(cat
    "$SECRETS_DIR/hf_token")"; fi
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=$HOME/pixi_zephon
  - export PATH="$HOME/.pixi/bin:$PATH"
  - export XDG_DATA_HOME="$PIXI_HOME/data"
  - export XDG_CACHE_HOME="$PIXI_HOME/cache"
  - export XDG_STATE_HOME="$PIXI_HOME/state"
  - export RATTLER_CACHE_DIR="$XDG_CACHE_HOME/rattler"
  - export PIXI_CACHE_DIR="$XDG_CACHE_HOME/pixi"
  - export HF_HOME=$HOME/.cache/huggingface
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: vpn
  slurm:
    cpus_per_gpu: 16
    gres: gpu:ampere:4
    job-name: bdd_llama1B_ze
    mem_per_gpu: 120G
    nodes: 1
    partition: batch
    time: 2-00:00:00

model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    dmodel: ${common.dmodel}
    init_fn:
      _partial_: true
      _target_: src.projected_compression.model.trunc_normal_
    vocab_size: ${common.vocab_size}
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.projected_compression.model.TransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.projected_compression.model.RoPEAttention
        dmodel: ${common.dmodel}
        k_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'(${common.datt} // ${model.encoder.block_fn.attention_fn.q_heads})
            * ${model.encoder.block_fn.attention_fn.kv_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        kv_heads: ${common.kv_heads}
        o_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.datt}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        q_heads: ${common.q_heads}
        q_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${common.datt}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        rope_base: 500000
        rope_scale_freqs: true
        seq_len: ${common.sequence_length}
        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}
      ff_layer_fn:
        _partial_: true
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        ff_post_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dff}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        ff_pre_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${common.dff}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-05
        normalized_shape: ${common.dmodel}
    n_blocks: ${common.n_blocks}
  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.projected_compression.model.Linear
      in_features: ${common.dmodel}
      out_features: ${common.vocab_size}
      partial_init_fn:
        _partial_: true
        _target_: src.projected_compression.model.llm_random_weight_init
        scale: 1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-05
      normalized_shape: ${common.dmodel}

overrides: []

trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: meta-llama/Llama-3.2-1B
      training_state_filename: null
      type: huggingface
    save:
      interval: 500
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: ${cluster_switch.nano_user_dir}/checkpoints/bdd/llama_1B_retrain_zephon
      training_state_filename: __training_state_filename.pt
      type: nano
  distributed:
    fsdp2:
      modules_to_shard:
      - ${model.embedding._target_}
      - ${model.encoder.block_fn._target_}
      - ${model.head._target_}
  eval_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.zephon_dataset.ZephonDataset
      cache_dir: ${cluster_switch.zephon_cache_dir}_eval
      cache_limit_gb: 50
      canonical_replicas: 4
      hf_path: hf://HuggingFaceFW/fineweb-edu@87f09149ef4734204d70ed1d046ddc9ca3f2b8f9~original/CC-MAIN-2025-26/train
      index_dir: ${cluster_switch.zephon_index_dir}
      max_samples: 8192
      name: fineweb_edu_eval
      prefetch_parallelism: 4
      seed: 123
      sequence_length: ${common.sequence_length}
      tokenize_fn:
        _target_: src.core.datasets.llama_tokenize_fn
      tokenize_parallelism: 4
      tokenizer_id: meta-llama/Llama-3.1-8B
      total_batch_size: ${common.batch_size}
    num_workers: 0
    total_batch_size: ${common.batch_size}
  eval_interval: 100
  gradient_accumulation_steps: 16
  gradient_clipping: 1.0
  learning_rate: 5.0e-05
  n_eval_steps: 10
  n_steps: 2000
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: ${eval:'int(${trainer.n_steps} * 0.01)'}
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.zephon_dataset.ZephonDataset
      cache_dir: ${cluster_switch.zephon_cache_dir}
      cache_limit_gb: 200
      canonical_replicas: 4
      exclude_prefixes:
      - data/CC-MAIN-2025-26/
      hf_path: hf://HuggingFaceFW/fineweb-edu@87f09149ef4734204d70ed1d046ddc9ca3f2b8f9~original/default/train
      index_dir: ${cluster_switch.zephon_index_dir}
      name: fineweb_edu
      prefetch_parallelism: 8
      seed: 123
      sequence_length: ${common.sequence_length}
      tokenize_fn:
        _target_: src.core.datasets.llama_tokenize_fn
      tokenize_parallelism: 8
      tokenizer_id: meta-llama/Llama-3.1-8B
      total_batch_size: ${common.batch_size}
    num_workers: 0
    total_batch_size: ${common.batch_size}
  weight_decay: 0.1
