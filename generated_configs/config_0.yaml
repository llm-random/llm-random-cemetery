_run_: true

cluster_switch:
  eval_path_c4: /net/storage/pr3/plgrid/plggllmeffi3/datasets/c4/validation
  eval_path_fineweb: /net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb/train
  train_path_c4: /net/storage/pr3/plgrid/plggllmeffi3/datasets/c4/train
  train_path_fineweb: /net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb/train

common:
  _target_: src.definitions.Common
  batch_size: 64
  data_seed: 123
  dff: 2816
  dhead: 64
  dmodel: 1024
  kv_heads: 16
  n_blocks: 16
  q_heads: 16
  sequence_length: 1024

evaluator: null

infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: 1
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: moe_2gpu
    new_wandb_job: true
    project_name: llm-random-test
    tags:
    - nano
    - remote
    - small
    - moe
    type: wandb
    wandb_entity: ideas_cv
  script:
  - ${export_env_variables_placeholders:}
  - module load ML-bundle/25.04
  - export PROJECT_HOME_PATH=$PLG_GROUPS_STORAGE/plggllmeffi3/nano
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=$PROJECT_HOME_PATH/$USER/pixi
  - export HF_HOME=$PROJECT_HOME_PATH/$USER/hf_cache
  - export PATH="$HOME/.pixi/bin:$PATH"
  - export HF_DATASETS_TRUST_REMOTE_CODE=1
  - export RATTLER_CACHE_DIR=$PROJECT_HOME_PATH/cache/rattler
  - export UV_CACHE_DIR=$PROJECT_HOME_PATH/cache/uv
  - export XDG_CACHE_HOME=$PROJECT_HOME_PATH/cache
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: helios
  slurm:
    cpus_per_gpu: 12
    gres: gpu:2
    job-name: ${infrastructure.metric_logger.name}
    mem_per_gpu: 90G
    nodes: 1
    partition: plgrid-gpu-gh200
    time: 0-02:00:00

model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    dmodel: ${common.dmodel}
    init_fn:
      _partial_: true
      _target_: src.projected_compression.model.trunc_normal_
    vocab_size: 50257
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.projected_compression.model.TransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.projected_compression.model.RoPEAttention
        dmodel: ${common.dmodel}
        k_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.kv_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        kv_heads: ${common.kv_heads}
        o_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        q_heads: ${common.q_heads}
        q_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        rope_base: 500000
        rope_scale_freqs: true
        seq_len: ${common.sequence_length}
        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}
      ff_layer_fn:
        _partial_: true
        _target_: src.core.moe.MoE
        activation_function: swiglu
        capacity_factor: 1.25
        dff: ${common.dff}
        dmodel: ${common.dmodel}
        init_scale: 1.0
        moe_load_balancing_loss_factor: 0.01
        moe_router_z_loss_factor: 0.001
        normalize_router_logits: false
        num_experts: 16
        topk: 1
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-05
        normalized_shape: ${common.dmodel}
    n_blocks: ${common.n_blocks}
  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.projected_compression.model.Linear
      in_features: ${common.dmodel}
      out_features: ${model.embedding.vocab_size}
      partial_init_fn:
        _partial_: true
        _target_: src.projected_compression.model.llm_random_weight_init
        scale: 1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-05
      normalized_shape: ${common.dmodel}

overrides:
- trainer.learning_rate=10

trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: null
      reset_scheduler: false
      rewind_data: false
      training_state_filename: null
      type: nano
    save:
      interval: -1
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: null
      training_state_filename: __training_state_filename.pt
      type: nano
  distributed:
    fsdp2:
      modules_to_shard:
      - ${model.embedding._target_}
      - ${model.encoder.block_fn._target_}
      - ${model.head._target_}
  eval_dataloader:
    _target_: src.context_scaling.dataset.get_dataloader
    dataset:
      _target_: src.context_scaling.dataset.AbstractDataset
      data_generator:
        _partial_: true
        _target_: src.context_scaling.dataset.get_dataset
        load_dataset_fn: null
        path: ${cluster_switch.eval_path_c4}
        shuffle: true
      sample_packer_fn:
        _partial_: true
        _target_: src.context_scaling.dataset.new_packer
      seed: ${common.data_seed}
      sequence_length: ${common.sequence_length}
      tokenize_fn:
        _target_: src.core.datasets.gpt2_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 0
    total_batch_size: ${common.batch_size}
  eval_interval: 100
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  learning_rate: 10
  n_eval_steps: 10
  n_steps: 1001
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.WSDScheduler
    decay_steps: ${eval:'int(${trainer.n_steps} * 0.1)'}
    n_steps: ${trainer.n_steps}
    warmup_steps: ${eval:'int(${trainer.n_steps} * 0.01)'}
  train_dataloader:
    _target_: src.context_scaling.dataset.get_dataloader
    dataset:
      _target_: src.context_scaling.dataset.AbstractDataset
      data_generator:
        _partial_: true
        _target_: src.context_scaling.dataset.get_dataset
        load_dataset_fn: null
        path: ${cluster_switch.train_path_c4}
        shuffle: true
      sample_packer_fn:
        _partial_: true
        _target_: src.context_scaling.dataset.new_packer
      seed: ${common.data_seed}
      sequence_length: ${common.sequence_length}
      tokenize_fn:
        _target_: src.core.datasets.gpt2_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 0
    total_batch_size: ${common.batch_size}
  weight_decay: 0.1
