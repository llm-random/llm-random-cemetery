_run_: true

cluster_switch:
  eval_path_c4: /net/scratch/hscra/plgrid/plgmaciejpioro/c4/validation
  eval_path_cosmopedia_v2: /net/storage/pr3/plgrid/plggllmeffi3/datasets/cosmopedia-v2
  eval_path_fineweb: /net/scratch/hscra/plgrid/plgmaciejpioro/fineweb-edu/train/train
  eval_path_fineweb_edu_dedup: /net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb-edu-dedup
  eval_path_open_web_math: /net/storage/pr3/plgrid/plggllmeffi3/datasets/open-web-math/train
  eval_path_python_edu: /net/storage/pr3/plgrid/plggllmeffi3/datasets/python-edu
  train_path_c4: /net/scratch/hscra/plgrid/plgmaciejpioro/c4/train
  train_path_cosmopedia_v2: /net/storage/pr3/plgrid/plggllmeffi3/datasets/cosmopedia-v2
  train_path_fineweb: /net/scratch/hscra/plgrid/plgmaciejpioro/fineweb-edu/train/train
  train_path_fineweb_edu_dedup: /net/storage/pr3/plgrid/plggllmeffi3/datasets/fineweb-edu-dedup
  train_path_open_web_math: /net/storage/pr3/plgrid/plggllmeffi3/datasets/open-web-math/train
  train_path_python_edu: /net/storage/pr3/plgrid/plggllmeffi3/datasets/python-edu

common:
  _target_: src.definitions.Common
  dff: 8192
  dhead: 64
  dmodel: 2048
  kv_heads: 32
  n_blocks: 24
  q_heads: 32
  sequence_length: 2048
  vocab_size: 49152

evaluator: null

infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: null
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: PC_save_pretrained_hf_to_nano
    new_wandb_job: true
    project_name: pc_smollm
    tags:
    - nano
    - pc
    - save_pretrained
    type: wandb
    wandb_entity: ideas_cv
  script:
  - ${export_env_variables_placeholders:}
  - module load ML-bundle/25.04
  - export PROJECT_HOME_PATH=$PLG_GROUPS_STORAGE/plggllmeffi/nano
  - export HF_HOME=/net/storage/pr3/plgrid/plggllmeffi3/datasets/hf_cache
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=$PLG_GROUPS_STORAGE/plggllmeffi3/md/nano
  - export PATH="$PIXI_HOME/bin:$PATH"
  - export XDG_DATA_HOME="$PIXI_HOME/data"
  - export XDG_CACHE_HOME="$PIXI_HOME/cache"
  - export XDG_STATE_HOME="$PIXI_HOME/state"
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: helios
  slurm:
    cpus_per_gpu: 12
    gres: gpu:4
    job-name: ${infrastructure.metric_logger.name}
    mem_per_gpu: 90G
    nodes: 1
    partition: plgrid-gpu-gh200
    time: 0-24:00:00

init_model_opt_sched_fn:
  _partial_: true
  _target_: src.core.llama.save_pretrained_llama_as_nano

model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    dmodel: ${common.dmodel}
    init_fn:
      _partial_: true
      _target_: src.projected_compression.model.trunc_normal_
    vocab_size: ${common.vocab_size}
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.projected_compression.model.TransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.projected_compression.model.RoPEAttention
        dmodel: ${common.dmodel}
        factor: 32
        high_freq_factor: 4
        k_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.kv_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        kv_heads: ${common.kv_heads}
        low_freq_factor: 1
        o_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        original_max_position_embeddings: 8192
        q_heads: ${common.q_heads}
        q_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        rope_base: 10000
        rope_scale_freqs: true
        seq_len: ${common.sequence_length}
        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}
      ff_layer_fn:
        _partial_: true
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        ff_post_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dff}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        ff_pre_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${common.dff}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-05
        normalized_shape: ${common.dmodel}
    n_blocks: ${common.n_blocks}
  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.projected_compression.model.Linear
      in_features: ${common.dmodel}
      out_features: ${model.embedding.vocab_size}
      partial_init_fn:
        _partial_: true
        _target_: src.projected_compression.model.llm_random_weight_init
        scale: 1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-05
      normalized_shape: ${common.dmodel}

overrides: []

trainer:
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: HuggingFaceTB/SmolLM-1.7B
      training_state_filename: null
      type: huggingface
    save:
      interval: -1
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /net/storage/pr3/plgrid/plggllmeffi3/md/smollm_nano.pt
      training_state_filename: __training_state_filename.pt
      type: nano
