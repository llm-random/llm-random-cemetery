_run_: true

apply_functions:
- _partial_: true
  _target_: src.projected_compression.pruning.prune
  dimensions_importances_path: /home/crewtool/checkpoints/importances/67992/0/minitron_dimensions_importances.pt
  target_dff: 1680
  target_dmodel: 630

cluster_switch:
  eval_path_c4: /storage_nvme_1/llm-random/datasets/c4/validation
  eval_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train
  train_path_c4: /storage_nvme_1/llm-random/datasets/c4/train
  train_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train

common:
  _target_: src.definitions.Common
  batch_size: 512
  dff: 2560
  dhead: 64
  dmodel: 960
  kv_heads: 5
  n_blocks: 32
  q_heads: 15
  sequence_length: 1024
  vocab_size: 49152

infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  metric_logger:
    _target_: src.definitions.MetricLoggerConfig
    heavy_metrics_calculation_interval: 100
    name: SLLM_360_prune
    new_neptune_job: true
    project_name: pmtest/llm-random
    tags:
    - nano
    - pc
    - hard_pruning
    - smollm_360
    - 50p
    type: neptune
  script:
  - PROJECT_HOME_PATH=/storage_nvme_4/projected_compression
  - "VENV_PATH=$PROJECT_HOME_PATH/pc_venv\nexport HF_HOME=$PROJECT_HOME_PATH/hf_cache\n\
    \n# Check if venv exists\nif [ ! -d \"$VENV_PATH\" ]; then\n  echo 'Virtual environment\
    \ not found. Creating...'\n  python3 -m venv \"$VENV_PATH\"\n  pip install --upgrade\
    \ pip\nfi \nsource \"$VENV_PATH/bin/activate\"\npip install --upgrade -r requirements.txt\n"
  server: entropym
  slurm:
    cpus_per_gpu: 15
    gres: gpu:4
    job-name: ${infrastructure.metric_logger.name}
    mem_per_gpu: 100G
    nodes: 1
    partition: h100
    time: 0-8:00:00

model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    dmodel: ${common.dmodel}
    init_fn:
      _partial_: true
      _target_: src.projected_compression.model.trunc_normal_
    vocab_size: ${common.vocab_size}
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.projected_compression.model.TransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.projected_compression.model.RoPEAttention
        dmodel: ${common.dmodel}
        factor: 32
        high_freq_factor: 4
        k_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.kv_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        kv_heads: ${common.kv_heads}
        low_freq_factor: 1
        o_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        original_max_position_embeddings: 8192
        q_heads: ${common.q_heads}
        q_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${eval:'${common.dhead} * ${model.encoder.block_fn.attention_fn.q_heads}'}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        rope_base: 10000
        rope_scale_freqs: true
        seq_len: ${common.sequence_length}
        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}
      ff_layer_fn:
        _partial_: true
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        ff_post_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dff}
          out_features: ${common.dmodel}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        ff_pre_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: ${common.dmodel}
          out_features: ${common.dff}
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-05
        normalized_shape: ${common.dmodel}
    n_blocks: ${common.n_blocks}
  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.projected_compression.model.Linear
      in_features: ${common.dmodel}
      out_features: ${model.embedding.vocab_size}
      partial_init_fn:
        _partial_: true
        _target_: src.projected_compression.model.llm_random_weight_init
        scale: 1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-05
      normalized_shape: ${common.dmodel}

overrides:
- trainer.n_steps=2048
- trainer.learning_rate=11

trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: HuggingFaceTB/SmolLM-360M
      training_state_filename: null
      type: huggingface
    save:
      interval: -1
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /storage_nvme_3/crewtool/nano_checkpoints/tmp
      training_state_filename: __training_state_filename.pt
      type: nano
  distributed:
    fsdp2:
      modules_to_shard:
      - ${model.embedding._target_}
      - ${model.encoder.block_fn._target_}
      - ${model.head._target_}
  eval_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset_path: ${cluster_switch.eval_path_fineweb}
    dataset_split: train
    dataset_type: fineweb-edu
    num_workers: 2
    seed: 123
    sequence_length: ${common.sequence_length}
    shuffle: true
    tokenize_fn:
      _target_: src.core.datasets.smollm_360_tokenize_fn
    total_batch_size: ${common.batch_size}
    use_new_sampling_method: true
    world_size_independent: false
  eval_interval: 100
  exp_learning_rate: null
  gradient_accumulation_steps: 4
  gradient_clipping: 1.0
  learning_rate: 11
  n_eval_steps: 10
  n_steps: 2048
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 40
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset_path: ${cluster_switch.train_path_fineweb}
    dataset_split: train
    dataset_type: fineweb-edu
    num_workers: 2
    seed: 1000
    sequence_length: ${common.sequence_length}
    shuffle: true
    tokenize_fn:
      _target_: src.core.datasets.smollm_360_tokenize_fn
    total_batch_size: ${common.batch_size}
    use_new_sampling_method: true
    world_size_independent: false
  weight_decay: 0.1
