overrides:
- common.target_dmodel=448
- trainer.n_steps=8192

trainer:
  _partial_: true
  _target_: src.core.trainer_distillation.TrainerDistillation
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: Qwen/Qwen3-1.7B-Base
      training_state_filename: null
      type: huggingface_qwen
    save:
      interval: -1
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /lustre/pd03/plgrid/plgllmefficont3/plgj321m/pc/checkpoints/hp_distil/qwen/1_7B
      training_state_filename: __training_state_filename.pt
      type: hf_only
  distillation_alpha: 0.5
  distillation_loss_num_chunks: 8
  distillation_temperature: 1.0
  distributed:
    fsdp2:
      modules_to_shard:
      - ${model.embedding._target_}
      - ${model.encoder.block_fn._target_}
      - ${model.head._target_}
  eval_dataloader: None
  eval_interval: 0
  gradient_accumulation_steps: 8
  gradient_clipping: 1.0
  learning_rate: 10
  n_eval_steps: 10
  n_steps: 8192
  original_llama_path: Qwen/Qwen3-1.7B-Base
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 40
  teacher_distributed:
    fsdp2:
      modules_to_shard:
      - ${distillation.teacher_model.embedding._target_}
      - ${distillation.teacher_model.encoder.block_fn._target_}
      - ${distillation.teacher_model.head._target_}
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.FineWebEduDataset
      path: ${cluster_switch.train_path_fineweb}
      seed: 1000
      sequence_length: ${common.sequence_length}
      shuffle: true
      split: train
      tokenize_fn:
        _target_: src.core.datasets.qwen_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 2
    total_batch_size: ${common.batch_size}
  weight_decay: 0.1
