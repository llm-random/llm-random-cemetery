infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: null
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: SLLM_1700_comp_70
    new_wandb_job: true
    project_name: pc_smollm
    tags:
    - nano
    - pc
    - smollm_1700
    - projected_compression
    - no_distillation
    - 70p
    - 2B_tokens
    type: wandb
    wandb_entity: ideas_cv
  script:
  - ${export_env_variables_placeholders:}
  - export HF_HOME="/lustre/pd03/plgrid/plgllmefficont3/md/hf_cache"
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=/home/grid/users/plgm1kush/.pixi
  - export PATH="$PIXI_HOME/bin:$PATH"
  - export XDG_DATA_HOME="$PIXI_HOME/data"
  - export XDG_CACHE_HOME="$PIXI_HOME/cache"
  - export XDG_STATE_HOME="$PIXI_HOME/state"
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: lem
  slurm:
    account: plgllmefficont3
    cpus_per_task: 64
    gres: gpu:hopper:4
    job-name: ${infrastructure.metric_logger.name}
    mem_per_gpu: 220G
    nodes: 1
    partition: plgrid-lem-gpu-h100
    time: 0-24:00:00

