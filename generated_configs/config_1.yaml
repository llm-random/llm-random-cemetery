overrides:
- trainer.n_steps=4096
- trainer.learning_rate=13

projected_compression:
  adjust_grad_norm: false
  cpu_offload_projections: false
  init_norms_with_ones: false
  modules_to_shard:
  - src.projected_compression.mem_eff.CompressibleBlock
  - ${model.source_model.embedding._target_}
  - ${model.source_model.encoder.block_fn._target_}
  - ${model.source_model.head._target_}
  separate_block_optimizers: true
  source_model_for_distillation: false

trainer:
  _partial_: true
  _target_: src.projected_compression.trainer.PCTrainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: HuggingFaceTB/SmolLM-1.7B
      training_state_filename: null
      type: huggingface
    save:
      interval: ${eval:'${trainer.n_steps} - 1'}
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: /lustre/pd03/plgrid/plgllmefficont3/md/checkpoints
      training_state_filename: __training_state_filename.pt
      type: nano_and_hf
  distributed:
    fsdp2: null
  eval_dataloader:
    _target_: src.core.datasets.get_mixture_of_datasets_dataloader
    dataset_split: validation
    datasets:
    - eval_fraction: 0.1
      path: ${cluster_switch.eval_path_fineweb_edu_dedup}
      weight: 0.7
    - eval_fraction: 0.1
      path: ${cluster_switch.eval_path_cosmopedia_v2}
      weight: 0.15
    - eval_fraction: 0.1
      path: ${cluster_switch.eval_path_python_edu}
      weight: 0.08
    - eval_fraction: 0.1
      path: ${cluster_switch.eval_path_open_web_math}
      weight: 0.07
    num_workers: 1
    seed: 42
    sequence_length: ${common.sequence_length}
    shuffle: true
    tokenize_fn:
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B
    total_batch_size: ${common.batch_size}
    use_new_sampling_method: true
    world_size_independent: false
  eval_interval: 50
  gradient_accumulation_steps: 8
  gradient_clipping: 0.25
  learning_rate: 13
  n_eval_steps: 10
  n_steps: 4096
  only_compress_model_gradient_clipping: false
  only_target_model_gradient_clipping: 1.0
  per_dataset_dataloaders:
    _target_: src.core.datasets.get_per_dataset_dataloaders
    datasets: ${trainer.eval_dataloader.datasets}
    num_workers: ${trainer.eval_dataloader.num_workers}
    seed: ${trainer.eval_dataloader.seed}
    sequence_length: ${common.sequence_length}
    shuffle: ${trainer.eval_dataloader.shuffle}
    tokenize_fn: ${trainer.eval_dataloader.tokenize_fn}
    total_batch_size: ${common.batch_size}
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: ${eval:'max(40, ${trainer.n_steps} // 100)'}
  train_dataloader:
    _target_: src.core.datasets.get_mixture_of_datasets_dataloader
    dataset_split: train
    datasets:
    - eval_fraction: 0.1
      path: ${cluster_switch.train_path_fineweb_edu_dedup}
      weight: 0.7
    - eval_fraction: 0.1
      path: ${cluster_switch.train_path_cosmopedia_v2}
      weight: 0.15
    - eval_fraction: 0.1
      path: ${cluster_switch.train_path_python_edu}
      weight: 0.08
    - eval_fraction: 0.1
      path: ${cluster_switch.train_path_open_web_math}
      weight: 0.07
    num_workers: 2
    seed: 1000
    sequence_length: ${common.sequence_length}
    shuffle: true
    tokenize_fn:
      _target_: src.core.datasets.get_tokenize_fn
      model_name: HuggingFaceTB/SmolLM-1.7B
    total_batch_size: ${common.batch_size}
    use_new_sampling_method: true
    world_size_independent: false
  weight_decay: 0.1
