defaults:
  - base_model
  - _self_

common:
  dmodel: 512
  dff: 2048
  dhead: 64
  sequence_length: 2048
  n_blocks: 2
  q_heads: 8
  kv_heads: 8

model:
  encoder:
    block_fn:
      ff_layer_fn:
        _target_: src.core.moe.SonicMoEFeedForward
        _partial_: true
        hidden_size: ${common.dmodel}
        intermediate_size: ${common.dff}
        num_experts: 4
        num_experts_per_tok: 2
        kernel_backend: auto
        activation_function: swiglu
        add_bias: false
        init_scale: 1.0

trainer:
  distributed:
    fsdp2:
      param_dtype: float32
      reduce_dtype: float32
