defaults:
  # - _cluster@_here_: helios_4
  - _cluster@_here_: entropy
  - _model@_here_: llama_3_1
  - _trainer@_here_: llama
  - _dataset@_here_: c4
  - _checkpoints@_here_: none
  - _misc@_here_: default
  - _mas@_here_: crewtool


common:
  sequence_length: 1024
  batch_size: 512

  # # 50%
  # dmodel: 1344
  # dff: 5376


trainer:
  gradient_accumulation_steps: 8
  n_steps: 0

  learning_rate: 6.103515625e-05


  checkpoint:
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B"
   save:
    type: nano
    path: /storage_nvme_3/crewtool/nano_checkpoints/tmp
  

infrastructure:
  metric_logger:
    name: Llame_PC
    tags:
      - nano
      - pc
      - minitron_prune
      - implementation_test

  slurm:
    gres: gpu:1
    cpus-per-task: 8
    job-name: test
    mem_per_gpu: 125G
    nodes: 1
    partition: h100
    time: "0-1:00:00"
    export: "ALL,HF_HUB_CACHE=/storage_nvme_3/crewtool/huggingface/hub"

apply_functions:
  - _target_: src.projected_compression.minitron.minitron_prune
    _partial_: true
    dataloader: ${trainer.train_dataloader}
    dmodel: ${common.dmodel}
    target_dmodel: 1344
    dff: ${common.dff}
    target_dff: 5376
    calibration_dataset_size: 1024
    seq_len: ${common.sequence_length}
    total_batch_size: ${trainer.train_dataloader.total_batch_size}
    n_blocks: ${model.encoder.n_blocks}
    checkpoint_save_path: ${trainer.checkpoint.save.path}
