defaults:
  - _misc@_here_: default
  - _dataset@_here_: fineweb
  - _cluster@_here_: helios
  - _model/llama@_here_: projected_8B
  - _trainer@_here_: llama

  - _checkpoints@_here_: none


infrastructure:
  slurm:
    gres: gpu:4
    nodes: 4
    job_name: test_job
    time: "0-03:40:00"
  # server: helios
  # experiment_prepare_venv_path:   /net/scratch/hscra/plgrid/plgcrewtool/prepare_venv/bin/activate # /net/storage/pr3/plgrid/plggllmeffi/tr_venv/bin/activate # $HOME/nano/.venv/bin/activate
  # experiment_prepare_venv_path: "$HOME/nano/.venv/bin/activate"
  # cemetery_experiments_dir: "$PLG_GROUPS_STORAGE/plggllmeffi/teraztutajproba"

common: 
  batch_size: 512
  sequence_length: 2048
  gradient_accumulation_steps: 8

trainer:
  n_steps: 1001
  learning_rate: 6.103515625e-05
  
  checkpoint:
    load:
      type: huggingface
      path: "meta-llama/Llama-3.1-8B"

    save:
      path: $PLG_GROUPS_STORAGE/plggllmeffi/projected_compression/checkpoint_test
      interval: 200