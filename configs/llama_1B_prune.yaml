defaults:
  # - _cluster@_here_: helios
  - _cluster@_here_: entropy
  - _model@_here_: llama_3_1
  - _trainer@_here_: llama
  # - _dataset@_here_: c4
  - _dataset@_here_: fineweb
  - _checkpoints@_here_: none
  - _misc@_here_: default


common:
  sequence_length: 1024
  batch_size: 512


trainer:
  gradient_accumulation_steps: 8
  # n_steps: 2048
  # n_steps: 401
  n_steps: 101
  # ^n_steps: 
  #   - 2048
    # - 4096
    # - 6144
    # - 8192
    # - 16384

  exp_learning_rate: 12
  # ^exp_learning_rate: 
    # - 13
    # - 12

  scheduler:
    warmup_steps: 40

  checkpoint:
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B"
   save:  
    type: nano
    path: /storage_nvme_3/crewtool/nano_checkpoints/tmp # entropy
    # path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/tem # helios

  train_dataloader:
    num_workers: 2
    seed: 1
    shuffle: true
    use_new_sampling_method: true
    world_size_independent: true

  eval_dataloader:
    num_workers: 2
    seed: 123
    shuffle: true
    use_new_sampling_method: true
    world_size_independent: true


infrastructure:
  metric_logger:
    name: Llame_HP
    tags:
      - nano
      - pc
      - llama_1
      - hard_pruning

  slurm:
    gres: gpu:4
    time: "0-8:00:00"
 
apply_functions:
  - _target_: src.projected_compression.pruning.prune
    _partial_: true
    # dimensions_importances_path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/pc/fw_importances_8m/minitron_dimensions_importances.pt # helios
    dimensions_importances_path: /storaage_nvme_3/crewtool/pc/fw_importances_8m/minitron_dimensions_importances.pt # entropy
    target_dmodel: 1344
    target_dff: 5376

