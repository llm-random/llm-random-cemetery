# ame_improve, dense h12 with the KV shift only: one corner of the 2 x 2 of
# QK-norm x KV shift on dense (documents/notes/settle_runs_report.md, run 5;
# Maciej asked for every combination, 2026-11-18). The other corners:
# dense_h12_qknorm_shift.yaml (both), dense_h12_qknorm.yaml / dense_h12_shift.yaml
# (one each), and S1-D itself (neither, W&B x0xlqroj). One submit = 1 run.
#
# A copy of configs/stage_1/dense_h12_lr_grid.yaml (S1-D). Only these differ:
#   - common.attention.shift: true (ame_improve 7345eebc): the KV shift,
#     applied before RoPE. QK-norm stays at the gqa default, off;
#   - trainer.learning_rate: 8, one value instead of the grid: S1-D's best n;
#   - /base_schema in the defaults, as every single-run config has (the grid
#     file leaves it out only because the schema rejects a ^ key);
#   - the 7 h limit and the r16-11 exclusion every LEM run gets;
#   - the run name and tags.
# Reference: S1-D at n = 8, W&B x0xlqroj (job 6252398_0), final_ce 2.9824: the
# same seed, data order, steps and schedule. No document mask, as x0xlqroj.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128; kept equal to the AME arms
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # The arm: dense attention with RoPE (base 10000), the h_balanced default.
  attention:
    type: gqa
    shift: true # stack-wide switch: KV shift, before RoPE

compile_blocks_full: true

trainer:
  # Throughput: micro-batch 32 is dense h12's best at 1 GPU (40.32% MFU,
  # 2.879 s/step, job 33119 on entropy, which ran with FSDP2 on). FSDP2 is off here, as
  # in the AME arms, so every Stage 1-2 run shares one precision path
  # (autocast bf16). The cost of that at h12 is unmeasured.
  gradient_accumulation_steps: 16 # micro-batch 32
  mem_parallel_size: null # dense attention has no banks
  distributed: null
  autocast_bf16: true # bf16 now comes from autocast instead of FSDP2

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1;
  #   - cosine schedule, warmup 1% = 38 steps, final LR 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 3815 # D = 4B tokens / 1,048,576 tokens per step
  learning_rate: 8 # LR = 2^-8, S1-D's best n
  checkpoint:
    save:
      # Only the final checkpoint is written (interval -1). It lands in the
      # job's cemetery clone, under checkpoint/<job id>/<array task id>/,
      # at ~2 GB per checkpoint.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:hopper:1 # LEM's gres syntax; entropy's was gpu:h100:1
    job-name: settle_dense_shift
    time: "0-07:00:00" # S1-D trained in 3.7 h on LEM; the switches add little compute
    exclude: r16-11 # bad GPU (2026-11-06)
  metric_logger:
    project_name: nano-ame
    name: ai_dense_h12_shift_lr8
    tags:
      - dense
      - h12
      - ame_improve
      - kv_shift
      - settle_runs
