defaults:
  # - _cluster@_here_: helios
  - _cluster@_here_: entropy
  - _model/llama@_here_: projected_1B
  - _trainer@_here_: llama
  - _dataset@_here_: fineweb
  - _checkpoints@_here_: none
  - _misc@_here_: default


common:
  sequence_length: 1024
  batch_size: 512
  # dmodel: 960
  # dff: 3840
  # dmodel: 1728
  # dff: 6912


trainer:
  gradient_accumulation_steps: 8
  ^n_steps: 
    # - 101
    - 2048
    # - 4096
    # - 6144
    # - 8192
    # - 12288
    # - 16384

  # exp_learning_rate: 13 # optimal 30%
  # exp_learning_rate: 14 # optimal 1B
  # exp_learning_rate: 15 # optimal 75%
  ^exp_learning_rate: 
    # - 11
    # - 12
    - 13
    - 14
    - 15
    # - 16
    # - 17

  scheduler:
    warmup_steps: 40


  checkpoint:
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B"
    # path: "/net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/llama1_ta3/llama1_ta3/" # helios ta3b
   save:  
    type: nano
    path: /storage_nvme_3/crewtool/nano_checkpoints/tmp # entropy
    # path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/tem # helios

infrastructure:
  metric_logger:
    name: Llame_PC
    tags:
      - nano
      - pc
      - llama_1
      - projected_compression
      
  server: entropym
  slurm: 
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:4
    # time: "0-4:00:00"
    # time: "0-8:00:00"
    time: "0-12:00:00"

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    # dimensions_importances_path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/pc/fw_importances_8m/minitron_dimensions_importances.pt # helios llama3
    # dimensions_importances_path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/tem/6854696/0/minitron_dimensions_importances.pt # helios ta3b
    # dimensions_importances_path: /storage_nvme_3/crewtool/pc/fw_importances_8m/minitron_dimensions_importances.pt # entropy
    dimensions_importances_path: /storage_nvme_3/crewtool/pc/fw_importances_8m/random_dimensions_importances.pt # entropy
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}
