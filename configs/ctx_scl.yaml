defaults:
  - _cluster@_here_: entropy
  - _model@_here_: k16
  - _trainer@_here_: context_scaling
  - _dataset@_here_: ctx_scl_dataset
  - _checkpoints@_here_: none
  - _misc@_here_: default
  - _eval@_here_: none
  - _self_

common:
  sequence_length: 2048
  batch_size: 128

trainer:
  gradient_accumulation_steps: 1
  n_steps: 101
  learning_rate: 2e-3
  eval_interval: 50
  eval_long_ctx_interval: 50
  n_eval_long_ctx_steps: 64

  train_dataloader:
    num_workers: 8
    dataset:
      load_dataset_fn:
        path: data

  eval_dataloader:
    num_workers: 8
    dataset:
      load_dataset_fn:
        path: data_eval

  eval_long_ctx_dataloader:
    num_workers: 8
    dataset:
      load_dataset_fn:
        path: data_long_ctx

infrastructure:
  metric_logger:
    name: context_scaling
    tags:
      - nano
      - k16
      - context_scaling
      - find_batch

  slurm:
    time: "00:30:00"
    gres: gpu:4
    job-name: ${infrastructure.metric_logger.name}