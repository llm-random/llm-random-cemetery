runner: "research.attention_moe.train.train"
time: "06:00:00"
n_gpus: 4
interactive_debug: false
backends_module: research.attention_moe.backends

# train params
params:
  name: "diff_baseline_adam_beta"

  # base bass
  mixed_precision: true
  flash_attention: true

  # logging etc.
  logger_types: "neptune"
  project_name: "pmtest/llm-random"
  logging_interval_heavy: 1000
  logging_interval_light: 500
  logging_interval_loss: 1000
  # save_weights_path: "model_ckpt"
  save_weights_interval: -1
  tags: ["diff_grad_acc"]


  cutoff: 2048

  batch_size: 64
  n_steps: 45000
  final_lr_step: 45000
  lr_warmup_steps: 4500
  gradient_accumulation_steps: 1

  # batch_size: 128
  # n_steps: 22500
  # final_lr_step: 22500
  # lr_warmup_steps: 2250
  # gradient_accumulation_steps: 2

  # batch_size: 256
  # n_steps: 11250
  # final_lr_step: 11250
  # lr_warmup_steps: 1125
  # gradient_accumulation_steps: 4

  scheduler: cosine
  final_lr_fraction: 0.1

  model_type: gpt
  dataset_type: c4

  
  # model
  use_rope: true

  # lowrank_dtype: float32
  ^dmodel: [768]
  n_blocks: 12
  ^n_att_heads: [12]
  data_seed: 42
  init_type: truncated_normal
  init_scale: 0.1
  mixed_precision_dtype: bfloat16
  # ^n_kv_heads: [12]

  # ^learning_rate: [5e-4, 1e-3, 2e-3, 5e-3]

  adam_beta1: 0.9
  adam_beta2: 0.95
  grad_clip: Null
  weight_decay: 0.1
  rms_norm_eps: 0.000001
  norm_class: rms_norm
  rope_theta: 10000
  ff_mode: swi_glu
  use_final_norm: true

  ^attention_mode: [differential]
  ^learning_rate: [1e-3]
  ^dff: [1856]

  # fsdp
  fsdp_enabled: true
  fsdp_modules_to_wrap: "TransformerBlock,EmbeddingLayer,PredictionHead"
  fsdp_selective_precision_modules: "AttentionMechanism,RoPE"
  torch_compile: false
  log_gradients_and_weights: true
