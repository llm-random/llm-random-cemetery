runner: "research.attention_moe.train.train"
time: "06:00:00"
n_gpus: 4
interactive_debug: false
backends_module: research.attention_moe.backends

# train params
params:
  name: "relu2_test"

  # base bass
  mixed_precision: true
  flash_attention: true

  # logging etc.
  logger_types: "neptune"
  project_name: "pmtest/llm-random"
  logging_interval_heavy: 1000
  logging_interval_light: 500
  logging_interval_loss: 1000
  # save_weights_path: "model_ckpt"
  save_weights_interval: -1
  tags: ["relu2_test"]


  cutoff: 2048

  batch_size: 128
  n_steps: 45000
  final_lr_step: 45000
  lr_warmup_steps: 4500
  gradient_accumulation_steps: 1



  scheduler: cosine
  final_lr_fraction: 0.1

  model_type: gpt
  dataset_type: c4


  ff_mode: "generalized_relu"
  ^generalized_relu_config: ["0/nl,0/nl,1/l", "0/nl,1/l", "0/nl,1/l,1/l"]
  
  # model
  use_rope: true

  ^dmodel: [768]
  n_blocks: 12
  ^n_att_heads: [12]
  data_seed: 42
  init_type: truncated_normal
  init_scale: 0.1
  mixed_precision_dtype: bfloat16


  adam_beta1: 0.9
  adam_beta2: 0.95
  grad_clip: Null
  weight_decay: 0.1
  rms_norm_eps: 0.000001
  norm_class: rms_norm
  rope_theta: 10000
  use_final_norm: true

  attention_mode: vanilla
  learning_rate: 1e-3
  dff: 2048

  # fsdp
  fsdp_enabled: true
  fsdp_modules_to_wrap: "TransformerBlock,EmbeddingLayer,PredictionHead"
  fsdp_selective_precision_modules: "AttentionMechanism,RoPE"
  torch_compile: false
  log_gradients_and_weights: true
