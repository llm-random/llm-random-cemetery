runner: "research.attention_moe.train.train"
time: 1-00:00:00
n_gpus: 4
interactive_debug: false
backends_module: research.attention_moe.backends

# train params
params:
  name: "intra_layer_balancing"

  # base bass
  mixed_precision: true
  flash_attention: true

  # logging etc.
  logger_types: "neptune"
  project_name: "pmtest/llm-random"
  logging_interval_heavy: 1000
  logging_interval_light: 500
  logging_interval_loss: 1000
  # save_weights_path: "model_ckpt"
  save_weights_interval: -1
  tags: ["intra_layer_balancing_via_load_balancing"]


  cutoff: 2048
  batch_size: 64
  n_steps: 45_000
  final_lr_step: 45_000
  scheduler: cosine
  lr_warmup_steps: 4500
  final_lr_fraction: 0.1

  model_type: gpt
  dataset_type: c4

  
  # model
  use_rope: true

  # lowrank_dtype: float32
  ^dmodel: [768]
  n_blocks: 12
  n_att_heads: 12
  data_seed: 42
  init_type: truncated_normal
  init_scale: 0.1
  mixed_precision_dtype: bfloat16
  # ^n_kv_heads: [12]

  # ^learning_rate: [5e-4, 1e-3, 2e-3, 5e-3]

  adam_beta1: 0.9
  adam_beta2: 0.98
  ^grad_clip: [1.0]
  weight_decay: 0.1
  rms_norm_eps: 0.000001
  norm_class: rms_norm
  rope_theta: 10000
  use_final_norm: true
  # ^repeat_activation_count: [1]


  ^dff: [
    2048
  ]
  ^attention_mode: [
    vanilla
  ]
  # ^diff_transformer_num_negative_heads: [1]
  ^learning_rate: [1e-3]
  gradient_accumulation_steps: 1
  # save_weights_path: "/storage_nvme_2/mpioro/checkpoints_better_diff"

  ff_mode: token_choice

  n_experts: 8
  dff: 2048
  expert_size: 2048
  evaluate_attention_relevancy_interval: 5000
  ^co_occurrence_loss_weight: [0.01, 0.001, 0.0]
  ^load_balancing_loss_weight: [0.01, 0.001, 0.0]

  zloss_weight: 0.001


  ^diff_transformer_adapter_type: [lora]

  # fsdp
  fsdp_enabled: true
  fsdp_modules_to_wrap: "TransformerBlock,EmbeddingLayer,PredictionHead"
  fsdp_selective_precision_modules: "AttentionMechanism,RoPE"
  torch_compile: false
  log_gradients_and_weights: true