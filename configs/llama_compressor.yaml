defaults:
  - _cluster@_here_: entropy_8
  # - _model@_here_: llama_3_1
  # - _trainer@_here_: llama_compressor
  - _dataset@_here_: c4
  # - _checkpoints@_here_: none
  # - _misc@_here_: default
  - _mas@_here_: default

common:
  _target_: src.definitions.Common
  dff: 7168
  dmodel: 2048
  head_norm: true
  model_type: gpt
  sequence_length: 1024
  vocab_size: 128256
  base_dff: 14336
  base_dmodel: 4096

model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.ProjectedEmbedding
    embedding:
      _target_: src.projected_compression.model.Embedding
      num_embeddings: ${common.vocab_size}
      embedding_dim: ${common.base_dmodel}
    result_out_features: ${common.dmodel} 
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    n_blocks: 32
    block_fn:
      _target_: src.projected_compression.model.TransformerBlock
      _partial_: true
      norm_fn: 
        _target_: src.core.model.RMSNorm
        _partial_: true
        eps: 1e-5
        normalized_shape: ${common.base_dmodel}
      attention_fn:
        _target_: src.projected_compression.model.RoPEAttention
        _partial_: true
        dmodel: ${common.base_dmodel}
        q_heads: 32
        kv_heads: 8
        seq_len: ${common.sequence_length}
        q_proj_fn:
          _target_: src.projected_compression.model.ProjectedLinear
          _partial_: true
          result_in_features: ${common.dmodel} 
          result_out_features: null
          base_in_features: ${common.base_dmodel}
          base_out_features: ${common.base_dmodel}
        k_proj_fn:
          _target_: src.projected_compression.model.ProjectedLinear
          _partial_: true
          result_in_features: ${common.dmodel} 
          result_out_features: null
          base_in_features: ${common.base_dmodel}
          base_out_features: ${eval:'${model.encoder.block_fn.attention_fn.kv_heads} * (${common.base_dmodel} // ${model.encoder.block_fn.attention_fn.q_heads})'}
        v_proj_fn: ${model.encoder.block_fn.attention_fn.k_proj_fn}
        o_proj_fn:
          _target_: src.projected_compression.model.ProjectedLinear
          _partial_: true
          result_in_features: null
          result_out_features: ${common.dmodel} 
          base_in_features: ${common.base_dmodel}
          base_out_features: ${common.base_dmodel}
        rope_base: 500000
        rope_scale_freqs: true

      ff_layer_fn:
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        _partial_: true
        ff_pre_act_fn:
          _target_: src.projected_compression.model.ProjectedLinear
          _partial_: true
          result_in_features: ${common.dmodel}
          result_out_features: ${common.dff}
          base_in_features: ${common.base_dmodel}
          base_out_features: ${common.base_dff}
        ff_post_act_fn: 
          _target_: src.projected_compression.model.ProjectedLinear
          _partial_: true
          result_in_features: ${common.dff}
          result_out_features: ${common.dmodel} 
          base_in_features: ${common.base_dff}
          base_out_features: ${common.base_dmodel}
        gate_fn: ${model.encoder.block_fn.ff_layer_fn.ff_pre_act_fn}

  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _target_: src.projected_compression.model.ProjectedLinear
      _partial_: true
      result_in_features: ${common.dmodel}
      result_out_features: null
      base_in_features: ${common.base_dmodel}
      base_out_features: ${common.vocab_size}
    norm_fn: 
        _target_: src.core.model.RMSNorm
        _partial_: true
        eps: 1e-5
        normalized_shape: ${common.base_dmodel}

trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer

  checkpoint:
    save:
      interval: -1
      model_checkpoint_filename: __model_optim_scheduler__.pt
      training_state_filename: __training_state__.pt
      path: checkpoints # Change me!

    load:
      type: huggingface
      path: "meta-llama/Llama-3.1-8B"

  eval_interval: 100
  n_eval_steps: 5

  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  n_steps: 100

  learning_rate: 0.001
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 500

  weight_decay: 0.1

  distributed:
    fsdp:
      mixed_precision:
        dtype: bfloat16
        ignored_classes:
          - src.core.model.RMSNorm
          - src.core.model.AttentionMechanism
      modules_to_wrap:
        - src.projected_compression.model.ProjectedEmbedding
        - src.projected_compression.model.TransformerBlock
        - src.projected_compression.model.TransformerHead

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    dmodel: ${common.dmodel}
    dff: ${common.dff}

infrastructure:
  slurm:
    export: "ALL,HF_HUB_CACHE=/storage_nvme_3/mstefaniak/huggingface/hub,HYDRA_FULL_ERROR=1"

  metric_logger:
    _target_: src.definitions.MetricLoggerConfig
    heavy_metrics_calculation_interval: 100
    name: test
    new_neptune_job: true
    project_name: pmtest/llm-random
    tags:
      - pc
      - nano
      - mas
      - llama_compressor 
      - import
    type: neptune


  generated_configs_path: generated_configs
