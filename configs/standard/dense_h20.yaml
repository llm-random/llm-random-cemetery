# The standard dense model at h20: GQA with RoPE, QK-norm and the KV shift, on
# 16B tokens on one H100 (LEM). Decided by Maciej on 2026-11-21
# (documents/notes/standard_model_improvements.md, "Decisions"). One submit =
# 1 run. Never trained with QK-norm and the shift at this size.
#
# A copy of configs/stage_1c/dense_h20_lr_grid.yaml (S1c-D). Only these differ:
#   - trainer.learning_rate: 9, one value instead of the grid: S1c-D's best n
#     (1x82rzby, final_ce 2.5059);
#   - common.attention.qk_norm: true and shift: true;
#   - /base_schema in the defaults, as every single-run config has (the grid
#     file leaves it out only because the schema rejects a ^ key);
#   - one GPU instead of four (below);
#   - the r16-11 exclusion, here instead of on the command line, and the run
#     name, tags and comments.
# Pair with 1x82rzby: the same seed, data order, steps and schedule. Every
# 4-GPU run before c5097166 (2026-11-26) shared one data order
# (world_size_independent: false), not the order of the 1-GPU runs. No
# document mask (rejected, 2026-11-21).
#
# One GPU (2026-11-27, Maciej: every standard run on one GPU). S1c-D and this
# file until then ran on 4 GPUs under FSDP2. Here FSDP2 is off, so bf16 comes
# from autocast, the precision path of every other standard run. The
# micro-batch is 4, as in the AME h20 run, so that both share one setting:
# dense alone fits 16 here, AME only 4 (ame_optimization_report.md §1.16). The
# data order does not depend on the GPU count or the micro-batch
# (world_size_independent, since c5097166).
#
# Recipe v2 (2026-11-25; documents/notes/archive/review_issues.md, N6-N8): each part of
# the model now initializes from its own seed (src/core/init_rng.py), so the same
# seed builds other weights than for the runs named above, and the QK-norm keeps
# q and k in the compute dtype. These runs pair with those in data order, steps
# and schedule, not in init: hence the _v2 run name and the standard_v2 tag.
#
# Recipe v3 (2026-11-26, branch ame_f1; PR #200, ee6e3742 on pretraining-jm):
# the held-out set is the end of each of fineweb's 64 equal segments, not the
# corpus tail (one easy crawl), so final_ce now matches pretraining-jm's at the
# same sequence_length. The training rows shift with the cut: these runs pair
# with no earlier run, in final_ce or in train batches, hence the _v3 run name
# and the standard_v3 tag.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h20
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128; kept equal to the AME run
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # Dense attention with RoPE (base 10000), the h_balanced default.
  attention:
    type: gqa
    qk_norm: true # stack-wide switch: l2 per head, learned tau (no weight decay)
    shift: true # stack-wide switch: KV shift, after QK-norm and before RoPE

compile_blocks_full: true

trainer:
  # One GPU, micro-batch 4: 4 x 128 = 512 sequences per step ("One GPU" above).
  gradient_accumulation_steps: 128 # micro-batch 4, as in the AME h20 run
  mem_parallel_size: null # dense attention has no banks
  distributed: null
  autocast_bf16: true # bf16 comes from autocast instead of FSDP2

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1;
  #   - cosine schedule, warmup 1% = 152 steps, final LR 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 15259 # D = 16B tokens / 1,048,576 tokens per step, rounded up
  learning_rate: 9 # LR = 2^-9, dense h20's best n
  checkpoint:
    save:
      # Only the final checkpoint is written (interval -1). It lands in the
      # job's cemetery clone, under checkpoint/<job id>/, at about 7 GB.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:hopper:1 # LEM's gres syntax
    job-name: std_dense_h20
    # LEM's limit. The run takes about 47 h, an estimate: 40.97% MFU at
    # micro-batch 4 on entropy (ame_optimization_report.md §1.16), +7% on LEM
    # and for the QK-norm and shift, +4% for evals.
    time: "3-00:00:00"
    exclude: r16-11 # bad GPU (2026-11-06)
  metric_logger:
    project_name: nano-ame
    name: std_dense_h20_lr9_v3
    tags:
      - dense
      - h20
      - standard
      - standard_v3
      - qk_norm
      - kv_shift
