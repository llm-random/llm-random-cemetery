# ame_h16.yaml on one LEM node (4 H100): only the GPU count and what follows
# from it differ. Asked by Maciej on 2026-11-27, to measure how much a run
# changes between 1 and 4 GPUs.
#
# Both runs start from the same weights: every rank builds the whole model from
# the seed before FSDP2 shards it (main.py), and the banks' column shards slice
# the full draw. They also read the same batches (world_size_independent, since
# c5097166), at the same micro-batch, 16. Only the numerics differ:
#   - FSDP2 shards the embedding, the blocks and the head, and computes in bf16
#     through its MixedPrecisionPolicy, where the 1-GPU run uses autocast;
#   - the banks are column-sharded over the 4 GPUs (mem_parallel_size 4, Tier 3);
#   - gradients are reduced over 4 ranks.
# The parallel settings are those of configs/ame/h16_4gpu.yaml, the best 4-GPU
# h16 cell measured: 1.689 s/step on entropy, peak 44.5 GiB
# (ame_optimization_report.md §1.15). No standard h16 run has used 4 GPUs
# before. Under FSDP2, alpha/beta, tau and the horizons are logged. Attention
# entropy and top-k mass are not, because they need the whole banks.
defaults:
  - ame_h16
  - _self_

trainer:
  gradient_accumulation_steps: 8 # micro-batch 16 = 512 / (4 GPUs x 8); 32 runs out of memory
  mem_parallel_size: 4 # banks column-sharded over the 4 GPUs (Tier 3)
  distributed:
    fsdp2:
      # _trainer/llama.yaml's list, restated: ame_h16.yaml sets distributed to null
      modules_to_shard:
        - ${model.embedding._target_}
        - ${model.encoder.block_fn._target_}
        - ${model.head._target_}
      reshard_after_forward: false # O33, ame_optimization_report.md §1.10
  autocast_bf16: false # bf16 comes from FSDP2's mixed precision

infrastructure:
  slurm:
    gres: gpu:hopper:4 # one whole LEM node; LEM's gres syntax
    job-name: std_ame_h16_4g
    # About 4 h on LEM, an estimate: 1.689 s/step on entropy, +3.5% on LEM and
    # for the standard recipe (as the h20 smoke against the same report), +5%
    # for the v4 dff, +4% for evals.
    time: "0-08:00:00"
  metric_logger:
    name: std_ame_h16_lr8_v4_4gpu
    tags:
      - ame
      - h16
      - standard
      - standard_v4
      - bank_lr4
      - bank_std1e4
      - dff_matched
      - 4gpu
