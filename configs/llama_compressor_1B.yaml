
defaults:
  - _cluster@_here_: entropy
  - _model/llama@_here_: projected_1B
  - _trainer@_here_: llama
  - _dataset@_here_: c4
  # - _dataset@_here_: fineweb
  - _checkpoints@_here_: none
  - _misc@_here_: default
  - _mas@_here_: crewtool


common:
  sequence_length: 1024
  batch_size: 512


trainer:
  gradient_accumulation_steps: 8
  # n_steps: 2048
  n_steps: 101
  # ^n_steps: 
    # - 4096
    # - 6144
    # - 8192
    # - 16384

  learning_rate: 6.103515625e-05

  checkpoint:
   save:  
    path: null
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B"

infrastructure:
  metric_logger:
    name: Llame_PC
    tags:
      - nano
      - pc
      - llama_1_pc

  slurm: 
    gres: gpu:4

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    dimensions_importances_path: /storage_nvme_3/crewtool/nano_checkpoints/tmp/65575/0/minitron_dimensions_importances.pt
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}
