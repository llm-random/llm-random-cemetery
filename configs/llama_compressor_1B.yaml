defaults:
  # - _cluster@_here_: helios
  - _cluster@_here_: entropy
  - _model/llama@_here_: projected_1B
  - _trainer@_here_: llama
  # - _dataset@_here_: c4
  - _dataset@_here_: fineweb
  - _checkpoints@_here_: none
  - _misc@_here_: default


common:
  sequence_length: 1024
  batch_size: 512


trainer:
  gradient_accumulation_steps: 8
  # n_steps: 2048
  # n_steps: 1001
  n_steps: 101
  # ^n_steps: 
  #   - 2048
    # - 4096
    # - 6144
    # - 8192
    # - 16384

  exp_learning_rate: 14
  # ^exp_learning_rate: 
  #   - 13
  #   - 14

  # ^weight_decay: 
  #   - 0.05
  #   - 0.1
  #   - 0.2

  scheduler:
    warmup_steps: 40

    # ^final_lr_fraction: 
    #   - 0.025
    #   - 0.1
    #   - 0.05


  checkpoint:
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B"
   save:  
    type: nano
    # path: /storage_nvme_3/crewtool/nano_checkpoints/tmp # entropy
    path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/tem # helios

infrastructure:
  metric_logger:
    name: Llame_PC
    tags:
      - nano
      - pc
      - llama_1
      - projected_compression

  slurm: 
    gres: gpu:4
    time: "0-8:00:00"

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    # dimensions_importances_path: /storage_nvme_3/crewtool/pc/fw_importances_8m/minitron_dimensions_importances.pt # helios
    dimensions_importances_path: /storage_nvme_3/crewtool/pc/fw_importances_8m/minitron_dimensions_importances.pt # entropy
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}
