
defaults:
  - _cluster@_here_: entropy
  - _model/llama@_here_: projected_1B
  - _trainer@_here_: llama
  - _dataset@_here_: c4
  - _checkpoints@_here_: none
  - _misc@_here_: default
  - _mas@_here_: crewtool
  # - _mas@_here_: helios


common:
  # sequence_length: 2048
  sequence_length: 1024
  batch_size: 512

  # 50%
  dmodel: 1344
  dff: 5376


trainer:
  gradient_accumulation_steps: 8
  n_steps: 2048
  scheduler:
    warmup_steps: 80
  # ^n_steps: 
  #  - 4096
  #  - 6144

  learning_rate: 6.103515625e-05
  # ^learning_rate: 
  #   - 7.62939453125e-06
  #   - 3.814697265625e-06
  #   - 0.000244140625

  checkpoint:
   save:  
    path: null
   load:
    type: huggingface
    path: "meta-llama/Llama-3.2-1B"

infrastructure:
  metric_logger:
    name: Llame_PC
    tags:
      - nano
      - pc
      - llama_1_pc
      - test_new_configs

  server: entropy_c
  slurm: 
    gres: gpu:4


