defaults:
  - default
  - _self_

trainer:
  train_dataloader:
    dataset_path: data
    dataset_split: train
    num_workers: 0
    tokenize_fn: 
      _target_: src.core.datasets.get_tokenize_fn
      model_name: gpt2

  eval_dataloader:
    dataset_path: data_eval
    dataset_split: validation
    num_workers: 0
    tokenize_fn: 
      _target_: src.core.datasets.get_tokenize_fn
      model_name: gpt2
