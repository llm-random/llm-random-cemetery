defaults:
  - default
  - _self_

trainer:
  train_dataloader:
    datasets:
      ${cluster_switch.train_path_c4}: 0.8
      ${cluster_switch.train_path_fineweb}: 0.2
    dataset_split: train
    num_workers: 4

  eval_dataloader:
    datasets:
      ${cluster_switch.eval_path_c4}: 0.8
      ${cluster_switch.eval_path_fineweb}: 0.2
    dataset_split: validation
    num_workers: 4