# Dropless MoE feed-forward (src/core/moe.py). Merged onto the dense ff_layer_fn node, whose
# ff_pre_act_fn / ff_post_act_fn / gate_fn partials build each expert. Turn it on with
#   - ../../_ff_layer@model.encoder.block_fn.ff_layer_fn: moe
# in a configs/jm/feature/ defaults list, after the parent config.
_target_: src.core.moe.MoE
num_experts: 8
topk: 2
load_balancing_loss_factor: 0.01
router_z_loss_factor: 0.001
# DeepSeek-V3 aux-loss-free balancing: per-step bias step size (V3 used 0.001); 0 is off
expert_bias_update_rate: 0.0
# Experts dff / topk wide, so active FF FLOPs per token match the dense layer.
ff_pre_act_fn:
  out_features: ${eval:'${common.dff} // ${model.encoder.block_fn.ff_layer_fn.topk}'}
ff_post_act_fn:
  in_features: ${eval:'${common.dff} // ${model.encoder.block_fn.ff_layer_fn.topk}'}
