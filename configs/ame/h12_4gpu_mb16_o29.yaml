# AME at H=12, four H100s, micro-batch 16 -- the missing cell of the h-sweep.
#
# The 2026-11-05 sweep measured five of the six (H, GPU-count) cells and left
# this one unrun, so section 6.1 of ame_optimization_report.md reads "never
# run" here. This config fills it.
#
# It is deliberately the *controlled* analogue of its two neighbours rather
# than a tuned configuration. `h16_4gpu_mb16_o29.yaml` and
# `h20_4gpu_mb16_mp4_o29.yaml` are the best-known 4-GPU configs for their H,
# and both carry the same four choices:
#
#     micro-batch 16 (gradient_accumulation_steps 8 at batch_size 512)
#     mem_parallel_size 4      -- the Q/K banks sharded across the four ranks
#     reshard_after_forward false  (O29)
#     sequence_length 2049     -- see below
#
# Holding all four fixed makes the three 4-GPU numbers a clean H-sweep: the
# only thing that varies across them is H. That is worth more here than
# squeezing this one cell.
#
# A caveat to record rather than hide: micro-batch 16 is probably *not* h12's
# best shape at four GPUs, and this run should not be quoted as "h12's 4-GPU
# MFU" without saying so. h16 at this shape peaked at 44.53 GiB of 80, and
# h12's banks are smaller again -- 0.927B parameters against h16's 1.648B, so
# roughly 2.9 GiB less per rank once sharded four ways -- while its activations
# scale with n_blocks x dmodel, 12*768 against 16*1024, about 56%. There is
# real headroom. Micro-batch 32 (gradient_accumulation_steps 4) is the obvious
# next probe. It is untested: the same step at h16 OOMed (job 32853, 6.14 GiB
# of [32, 2048, 50304] bf16 logits on top of 74.50 GiB in use), and h12 may or
# may not clear that margin.
#
# sequence_length 2049, not 2048: `_preprocess_input` takes `batch[:, :-1]` for
# next-token targets, so the model sees 2048 -- which is 16 * 128, and
# flex_attention's row-blocks are 128-wide. At 2047 the last row-block is
# ragged and costs 479.9 ms per step at the h20 shape (job 32688). Every config
# in this directory carries it. It reads like a typo; it is not one.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  # 2049, not 2048: the model sees width - 1 = 2048, which is 16 * 128.
  sequence_length: 2049
  batch_size: 512
  attention:
    type: ame

trainer:
  n_steps: 30
  learning_rate: 0.000244140625 # 2^-12, held across the whole sweep: this is a
  # throughput run, and changing two things at once would make it unreadable.
  gradient_accumulation_steps: 8 # micro-batch 16 at 4 GPUs
  eval_interval: 0
  eval_dataloader: null
  scheduler:
    warmup_steps: 10
  mem_parallel_size: 4
  distributed:
    fsdp2:
      reshard_after_forward: false # O29, worth 50 ms at h20 for 1.1 GiB

compile_blocks_full: true

infrastructure:
  slurm:
    gres: gpu:h100:4
    job-name: ame_h12_4g16
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-ame
    name: ame_h12_4gpu_mb16_o29
    tags:
      - ame
      - h12
      - multigpu
      - hsweep
      - mp4
      - sinkmerge
      - align
