# _run_: true

defaults:
  - _checkpoint@_here_: default
  - _dataset@_here_: c4
  - _self_

common:
  _target_: src.definitions.Common
  dff: 8192
  dmodel: 2048
  head_norm: true
  init_scale: 0.1
  init_type: truncated_normal_fixed
  model_type: gpt
  sequence_length: 512
  vocab_size: 128256
  
model:
  _target_: src.core.model.LLM

  embedding:
    _target_: src.core.model.TokenEmbedding
    vocab_size: ${common.vocab_size}
    embedding_dim: ${common.dmodel}
    init_type: ${common.init_type}
    init_scale: ${common.init_scale}

  tower:
    _target_: src.core.model.TransformerTower
    n_blocks: 16
    block_fn:
      _target_: src.core.model.TransformerBlock
      _partial_: true
      residual_fn:
        _target_: src.core.model.PreNormBlock
        _partial_: true
        dmodel: ${common.dmodel}
        norm_class:
          _target_: src.core.model.RMSNorm
          _partial_: true
          eps: 1e-5

      attention_fn:
        _target_: src.core.llama.LlamaAttention
        _partial_: true
        dmodel: ${common.dmodel}
        q_heads: 32
        kv_heads: 8
        seq_len: ${common.sequence_length}
        causal: true
        init_scale: ${common.init_scale}
        init_type: ${common.init_type}

      ff_layer_fn:
        _target_: src.core.llama.LLamaFeedForward
        _partial_: true
        dmodel: ${common.dmodel}
        dff: ${common.dff}
        init_scale: ${common.init_scale}
        init_type: ${common.init_type}

  head:
    _target_: src.core.model.PredictionHead
    embedding_dim: ${common.dmodel}
    output_size: ${common.vocab_size}
    init_type: ${common.init_type}
    init_scale: ${common.init_scale}
    use_layer_norm: ${common.head_norm}

trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer

  eval_interval: 500
  n_eval_steps: 20

  gradient_accumulation_steps: 4

  gradient_clipping: 1.0
  n_steps: 2000

  learning_rate: 0.00005
  
  weight_decay: 0.1

  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 500

  distributed:
    fsdp:
      mixed_precision:
        dtype: bfloat16
        ignored_classes:
          - LayerNorm
          # - AttentionMechanism # no gqa
          - LlamaAttention # gqa
      modules_to_wrap:
        - TransformerBlock
        - EmbeddingLayer
        - PredictionHead

infrastructure:
  slurm:
    cpus-per-task: 16
    gres: gpu:4
    job-name: test
    mem_per_gpu: 90G
    nodes: 1
    partition: h100 # entropy
    # partition: plgrid-gpu-gh200 # helios
    time: "0-05:00:00"
    ntasks-per-node: 4

  # venv_path: $HOME/nano/.venv/bin/activate # mik entropy; mas helios
  venv_path: /dev/null
  experiment_prepare_venv_path: ${infrastructure.venv_path}

  cemetery_experiments_dir: ~/llmrandom_cemetery

  metric_logger:
    _target_: src.definitions.MetricLoggerConfig
    heavy_metrics_calculation_interval: 500
    name: test
    new_neptune_job: true
    project_name: pmtest/llm-random
    tags:
      - pc
      - nano
      - test_configs
      - dataset_in
    type: neptune

  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git

  # server: helios # helios
  server: entropy # entropy
  # server: entropy_c

  generated_configs_path: generated_configs