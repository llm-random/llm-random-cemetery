# @package _global_
# Speedup A/B: runs the MoECompilable class with compile on vs off.
# Short duration mirrors dense_mha.yaml; everything else mirrors moe_mha.yaml.
defaults:
  - /_cluster@_here_:                entropy
  - /_model/context_scaling@_here_:  template
  - /_trainer@_here_:                context_scaling
  - /_dataset@_here_:                fineweb
  - /_checkpoints/context_scaling@_here_: shared_entropy
  - /_infrastructure@_here_:         default
  # - /_downstream_eval@_here_:        joint

  - /_feedforward:                   moe_compilable
  - /_attention:                     mha
  - /_parameterization:              simpleP_k12
  - _self_

common:
  n_blocks: 12
  batch_size: 128
  sequence_length: 1024

trainer:
  gradient_accumulation_steps: 1
  n_steps: 1_001
  learning_rate: 10
  eval_interval: 1000
  n_eval_steps: 10
  downstream_eval_interval: -1
  fixed_eval: true
  scheduler:
    warmup_steps: 1000
  eval_dataloader:
    total_batch_size: 128

model:
  encoder:
    block_fn:
      ff_layer_fn:
        ^compile: [false, true]

infrastructure:
  metric_logger:
    heavy_metrics_calculation_interval: 250
    name: moe_compile_test
    tags:
      - nano
      - moe_compile_test
      - moe
      - mha
      - simpleP_k12
      - k12
      - bs${common.batch_size}
      - lr${trainer.learning_rate}
      - compile${model.encoder.block_fn.ff_layer_fn.compile}
      - ${now:%Y-%m-%d}

  slurm:
    time: "0-01:00:00"
    gres: gpu:4
    job-name: ${infrastructure.metric_logger.name}
