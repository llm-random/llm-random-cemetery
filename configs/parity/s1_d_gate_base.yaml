# Parity audit (documents/notes/ame_efficiency_parity_plan.md), the dense gate base:
# S1-D exactly as configs/stage_1/dense_h12_lr_grid.yaml ran it as W&B x0xlqroj
# (n = 8, GQA with RoPE, micro-batch 32 x 16, autocast bf16, compile_blocks_full),
# with the same two changes as s2_ps_gate_base.yaml: the 300-step gate schedule,
# and entropy without a checkpoint. A plain config, not a grid, so it carries
# /base_schema; the schema defaults it adds are the Trainer's own defaults.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - _self_

common:
  sequence_length: 2049
  batch_size: 512
  attention:
    type: gqa

compile_blocks_full: true

trainer:
  gradient_accumulation_steps: 16 # micro-batch 32, as in x0xlqroj
  mem_parallel_size: null
  distributed: null
  autocast_bf16: true
  n_steps: 300
  learning_rate: 8 # n = 8, LR = 2^-8, as in x0xlqroj
  scheduler:
    warmup_steps: 38

infrastructure:
  # entropy.yaml's script, plus every compile cache on the node's NVMe: h100a's
  # /tmp filled up on 2026-11-06 ~22:40 and killed five gates (Errno 28).
  script:
    - '${export_env_variables_placeholders:}'
    - 'export PROJECT_HOME_PATH=/storage_nvme_4/nano'
    - 'export HF_HOME=$PROJECT_HOME_PATH/hf_cache'
    - 'export HYDRA_FULL_ERROR=1'
    - 'export PIXI_HOME=$PROJECT_HOME_PATH/$USER/pixi'
    - 'export PATH="$HOME/.pixi/bin:$PATH"'
    - 'export XDG_DATA_HOME="$PIXI_HOME/data"'
    - 'export XDG_CACHE_HOME="$PIXI_HOME/cache"'
    - 'export XDG_STATE_HOME="$PIXI_HOME/state"'
    - 'export TMPDIR=$PROJECT_HOME_PATH/$USER/parity_tmp/$SLURM_JOB_ID'
    - 'mkdir -p $TMPDIR'
    - 'export TORCHINDUCTOR_CACHE_DIR=$TMPDIR/inductor'
    - 'cd "$PIXI_HOME"'
    - 'eval "$(pixi shell-hook)"'
    - 'cd -'
  slurm:
    gres: gpu:h100:1
    job-name: parity
    time: "0-01:00:00"
  metric_logger:
    project_name: nano-ame-parity
    name: ???
    tags:
      - parity
      - dense
      - h12
      - s1_d
