# ame_bf16_scalars_plan.md Step 3: S1-D at n = 8 for the full 4B tokens, ON ENTROPY,
# the same recipe as fe_s2_ps_base.yaml. Final checkpoint only.
defaults:
  - s1_d_gate_base
  - _self_
trainer:
  n_steps: 3815
  scheduler:
    warmup_steps: 38
  checkpoint:
    save:
      # On h100a's NVMe, not in the cemetery clone under /home: the 120 GB /home quota
      # cannot hold 13.2 GB AME checkpoints (P1-1, job 36408, died of it at step 1,500,
      # and the 12 queued runs failed at launch). Resolved on the node.
      path: /storage_nvme_1/${oc.env:USER}/parity_full/${infrastructure.metric_logger.name}
      interval: -1
infrastructure:
  slurm:
    job-name: parity_full
    # Below the analysis and scoring jobs, which submit at nice 0 and so start
    # first whenever one of the 8 GPUs frees up.
    nice: 100
    time: "0-05:00:00"
  metric_logger:
    name: ???
    tags:
      - parity
      - parity_full
      - dense
      - h12
