defaults:
  # - _cluster@_here_: helios
  - _cluster@_here_: entropy
  - _model/smollm@_here_: projected_1700
  - _trainer@_here_: llama
  - _dataset@_here_: fineweb
  - _checkpoints@_here_: none
  - _misc@_here_: default

common:
  # batch_size: 512
  batch_size: 1 #dev
  
  # dmodel: 1088 # 35
  # dff: 4352
  # dmodel: 768 # 20
  # dff: 3072

trainer:
  gradient_accumulation_steps: 1
  ^n_steps: 
    - 101 #dev
    # - 2048
    # - 4096
    # - 6144
    # - 8192
    # - 12288
    # - 16384

  # learning_rate: 14 # 50 1B
  # learning_rate: 14 # 35 1B
  # learning_rate: 14 # 20 1B
  ^learning_rate: 
    # - 10
    # - 11
    # - 12
    # - 13
    - 14
    # - 15
    # - 16
    # - 17

  scheduler:
    warmup_steps: 40

  checkpoint:
   load:
    type: huggingface
    path: "HuggingFaceTB/SmolLM-1.7B"
  #  save:
  #   type: nano
  #   path: /storage_nvme_3/crewtool/nano_checkpoints/tmp #change

  train_dataloader:
    tokenize_fn: 
      _target_: src.core.datasets.smollm_1700_tokenize_fn

  eval_dataloader:
    tokenize_fn: 
      _target_: src.core.datasets.smollm_1700_tokenize_fn

infrastructure:
  metric_logger:
    name: SMOLLM_training
    tags:
      - nano
      - pc
      - projected_compression
      - smollm_1700
      - 50p
      # - 35p
      # - 20p
      - test


  server: entropym
  slurm: 
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:1 #dev
    time: "0-4:00:00"
    # time: "0-8:00:00"
    # time: "0-12:00:00"

apply_functions:
  - _target_: src.projected_compression.compression.init_compression
    _partial_: true
    # dimensions_importances_path: /home/crewtool/checkpoints/importances/68000/0/minitron_dimensions_importances.pt # activations entropy llmr300 #dev
    # dimensions_importances_path: asd/minitron_dimensions_importances.pt # activations helios llmr300

    dimensions_importances_path: /home/crewtool/checkpoints/importances/68000/0/random_dimensions_importances.pt # random entropy llmr300
    # # # # dimensions_importances_path: asd/random_dimensions_importances.pt # random helios llmr300
    target_dmodel: ${common.dmodel}
    target_dff: ${common.dff}