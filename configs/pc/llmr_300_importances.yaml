  #   # path: /home/mstefaniak/checkpoints/def_1536_254236.pt
  #   path: /home/mstefaniak/checkpoints/def_4ff_1024_92688.pt # entropy

   save:
    type: nano
    # path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/tem # change
    # path: /storage_nvme_3/mstefaniak/nano_checkpoints/tmp # change
    path: /home/mstefaniak/checkpoints/importances

  train_dataloader:
    tokenize_fn: 
      _target_: src.core.datasets.gpt2_tokenize_fn

  eval_dataloader:
    tokenize_fn: 
      _target_: src.core.datasets.gpt2_tokenize_fn

infrastructure:
  server: entropym
  metric_logger:
    name: Llame_importances
    tags:
      - nano
      - pc
      - IMPORTANCES
      # - 8xCalibration
      - fineweb
      # - TA3B
      # - TA10B
      # - c4
      - llmr300
      - dummy
      - REBUTAL

  slurm:
    job-name: importances
    gres: gpu:1
    nodes: 1
    time: "0-2:00:00"


apply_functions:
  - _target_: src.projected_compression.weight_importances.dummy_importances
    _partial_: true
    dmodel: ${common.dmodel}
    dff: ${common.dff}
    n_blocks: ${model.encoder.n_blocks}
    checkpoint_save_path: ${trainer.checkpoint.save.path}
