  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default

common:
  batch_size: 4

trainer:
  gradient_accumulation_steps: 8
  n_steps: 0

  learning_rate: 1

  checkpoint:
  #  load:
  #   # type: huggingface
  #   # path: "meta-llama/Llama-3.2-1B"
  #   # path: "/net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/llama1_ta3/llama1_ta3/" # TA3B
