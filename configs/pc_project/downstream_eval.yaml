  # - ../_cluster@_here_: entropy
  - ../_misc@_here_: default

wandb:
  entity: ideas_cv
  project: llm-random-test
  name: hf_eval
  tags:
    - eval
    - hf_model
    # - llama_8
    - llama_1
    # - pc
    # - pcd
    # - pcdd
    # - hp
    # - hpd
    # - 10p
    # - 30p
    # - 50p
    - 0_numshot
    # - test

# default_tokenizer: meta-llama/Llama-3.1-8B
default_tokenizer: meta-llama/Llama-3.2-1B

tasks:
  - arc_easy
  - arc_challenge
  - hellaswag
  - piqa
  - winogrande
  - openbookqa
  - sciq
  - social_iqa
  - lambada_openai

limit: null  # set to e.g. 100 for quick test
output_dir: null  # null = save results next to each model checkpoint
batch_size: 4
num_fewshot: 0

device: cuda

infrastructure:
  slurm:
    gres: "gpu:hopper:1"  # lem — 1 GPU is enough for lm_eval inference
    # gres: gpu:1          # helios / entropy
    time: "1-00:00:00"
    # time: "0-02:00:00" # test

