defaults:
  - ../_cluster@_here_: helios
  # - ../_cluster@_here_: entropy
  - ../_model@_here_: llama_3_1
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default


common:
  sequence_length: 1024
  batch_size: 512

  #devchange
  # dmodel: 448 # 10
  # dff: 1728
  # dmodel: 960 # 30
  # dff: 3840
  dmodel: 1344 # 50
  dff: 5376


trainer:
  gradient_accumulation_steps: 32
  ^n_steps:
    # - 2048 # 1B tokens
    - 4096
    # - 6144
    # - 8192
    # - 12288

  ^learning_rate:  # tune on 1BT
    - 11
    - 12
    - 13
    - 14

  train_dataloader:
    dataset:
      seed: 1000

  scheduler:
    warmup_steps: 40

  eval_interval: 1000000
  eval_dataloader: None

  # checkpoint:
  #  save:
  #   type: nano
  #   path: ??? #dev


infrastructure:
  metric_logger:
    name: Llame_TA
    tags:
      - nano
      - pc
      - llama_1
      - pretraining
      - lr_tuning
      - 50p
      # - 30p
      # - 10p

  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:2
    time: "2-00:00:00"