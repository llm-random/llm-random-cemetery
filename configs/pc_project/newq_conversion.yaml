# notebook for producing a PC checkpoint used for PC_memeff training

defaults:
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/llama@_here_: 1B
  - _self_


trainer:
  checkpoint:
    load:
      type: huggingface
      path: "Qwen/Qwen3.5-0.8B-Base"

    save:
      path: /lustre/pd03/plgrid/plgllmefficont3/plgj321m/pc/qwen08b_in_nano.pt

infrastructure:
  metric_logger:
    name: PC_save_pretrained_hf_to_nano
    tags:
      - nano
      - pc
      - save_pretrained
      - qwen
  
  slurm: 
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:hopper:1
    time: "0-01:00:00"

init_model_opt_sched_fn: 
  _target_: src.core.llama.save_pretrained_llama_as_nano
  _partial_: true