defaults:
  - ../_cluster@_here_: lem #lem
  # - ../_cluster@_here_: helios
  # - ../_cluster@_here_: entropy
  - ../_model@_here_: llama_3_8
  - ../_trainer@_here_: llama3_8B_distillation
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none
  - ../_misc@_here_: default


common:
  sequence_length: 2048
  batch_size: 512


  #devchange
  # target_dmodel: 1056 # 10p
  # target_dff: 3168
  # target_dmodel: 2160 # 30p
  # target_dff: 6480
  target_dmodel: 3072 # 50p
  target_dff: 9216
  
trainer:
  eval_interval: 1000000
  gradient_accumulation_steps: 32
  # gradient_accumulation_steps: 8
  # gradient_accumulation_steps: 4
  n_steps: 1024

  # learning_rate: asd #optimal fo 10p
  # learning_rate: asd #optimal fo 30p
  # learning_rate: asd #optimal fo 50p

  #devchange
  ^learning_rate: #50p
    - 10
    # - 11
    # - 12
    # - 13
    # - 14

  # ^learning_rate: #30p
  #   - 10
  #   - 11
  #   - 12
  #   - 13
  #   - 14

  # ^learning_rate: #10p
  #   - 9
  #   - 10
  #   - 11
  #   - 12
  #   - 13

  scheduler:
    warmup_steps: 40

  eval_dataloader: None

  checkpoint:
   load:
    type: huggingface
    path: "meta-llama/Llama-3.1-8B" 
    # path: "/net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/llama1_ta3/llama1_ta3/" # helios ta3b
    # path: "/storage_nvme_3/mstefaniak/nano_checkpoints/llama1_ta3/66415/0" # entropy ta3b
    # path: /storage_nvme_3/mstefaniak/nano_checkpoints/llama1_ta3/66751/0 # entropy ta10b
   save:  
    type: nano
    path: /lustre/pd01/plgrid/plgllmefficont2/projected_compression/checkpoints/tmp ##########################################################################################################
    # path: /storage_nvme_3/mstefaniak/nano_checkpoints/tmp # entropy
    # path: /net/scratch/hscra/plgrid/plgmstefaniak/checkpoints/tem # #helios

#devchange
infrastructure:
  metric_logger:
    name: Llame_HP
    tags:
      - nano
      - pc
      - llama_8
      - hard_pruning
      - distillation
      - 50p
      # - 30p
      # - 10p
      - grad_acc_32
  
  slurm:
    job-name: ${infrastructure.metric_logger.name}
    gres: "gpu:hopper:4" #dev
    # gres: gpu:4
    time: "0-0:30:00"
    # time: "0-8:00:00"
    # time: "0-10:00:00"
    # time: "0-12:00:00"
    # time: "0-24:00:00"
 
