infrastructure:
  metric_logger:
    name: Llame_PC
    tags:
      - nano
      - pc
      - llmrandom_800
      - projected_compression
      
  server: entropym
  slurm: 
    job-name: ${infrastructure.metric_logger.name}
    gres: gpu:4
    # time: "0-4:00:00"
    # time: "0-8:00:00"
    time: "0-12:00:00"

apply_functions:
