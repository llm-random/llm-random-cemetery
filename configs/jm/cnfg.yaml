time: "1-00:00:00"

n_gpus: 1
cpus_per_gpu: 16

params:
  # name: "test"
  name: "flops_count_1600_8"
  # tags: ["aux_loss_fix", "old_implementation"]
  tags: ["remove", "flops_count"]

  # training
  n_steps: 25000
  final_lr_step: 25000
  lr_warmup_steps: 1250
  gradient_accumulation_steps: 0
  batch_size: 256
  cutoff: 2048

  # model
  model_type: gpt
  dmodel: 1024
  n_att_heads: 16
  n_blocks: 16

  # MoE
  effective_dff_x: 3  # went from 4 -> 3
  expansion_rate: 8
  granularity: 1
  ff_mode: token_choice
  moe_inner_expert: swi_glu
  use_torch_bmm: true
  softmax_over: experts
  group_granular_moe_by_batch: true
  granular_moe_one_hot_impl: true
  capacity_factor: 1.0

  # aux losses MoE
  load_balancing_loss_weight: 0.01
  zloss_weight: 0.001

  # # dense
  # ff_mode: vanilla
  # dff: 4096
  # activation_type: relu


  # learning
  scheduler: cosine
  learning_rate: 1e-3
  # ^learning_rate: [1e-3, 5e-4, 2e-4, 1e-4, 5e-5]
  final_lr_fraction: 0.1
  grad_clip: 1.0
  weight_decay: 0.1
  init_scale: 0.1
  # ^init_scale: [1.0, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01]
  init_type: truncated_normal

  # other
  # dataset_type: fineweb-edu
  dataset_type: c4
  mixed_precision: true
  mixed_precision_dtype: bfloat16

  # # FSDP
  # fsdp_enabled: True
  # fsdp_modules_to_wrap: "EmbeddingLayer,PredictionHead,TransformerBlock"
  # activation_checkpointing_modules: "EmbeddingLayer,PredictionHead,TransformerBlock"
  # fsdp_selective_precision_modules: "AttentionMechanism,MoeGating,RoPE"

  # logging etc.
  logger_types: "neptune"
  project_name: "pmtest/llm-random"
  logging_interval_heavy: 5000
  logging_interval_loss: 1000
  save_weights_interval: -1
  eval_interval: -1
  n_final_eval_batches: -1

  # debug
  logger_types: "stdout"
  n_steps: 1
  batch_size: 1
  cutoff: 512
  use_dummy_dataset: true
  n_blocks: 2
  dmodel: 16
  n_att_heads: 2

  print_parameter_names: true

  # 85M
  dmodel: 1920
  n_blocks: 30
  n_att_heads: 30
  expansion_rate: 8
