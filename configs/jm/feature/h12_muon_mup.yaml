# h12_chinchilla with muP for Muon, base width h4 (m = 3 at h12); muP changes no FLOPs, so 50_000 steps.
defaults:
  - ../h12_chinchilla@_global_
  - override ../../_trainer/_optimizer@optimizer: muon_mup
  - _self_

trainer:
  # 10 - log2(3) / 2: the Muon matrices get 2^-9.2075 / sqrt(3) = 2^-10, h12_muon's LR
  learning_rate: 9.2075

infrastructure:
  metric_logger:
    name: h12_muon_mup
    tags:
      - nano
      - h12
      - chinchilla
      - wsd
      - qk_norm
      - bs64
      - muon
      - muon_mup
