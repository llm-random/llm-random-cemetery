# h12_kprof with QK-norm: the per-kernel dump that shows what the ~3.4% QK-norm step time goes to.
defaults:
  - h12_kprof@_global_
  - _self_

common:
  attention:
    qk_norm: true

infrastructure:
  metric_logger:
    name: h12_qk_norm_kprof
    tags:
      - nano
      - h12
      - kprof
      - qk_norm

  slurm:
    time: "00:15:00"
