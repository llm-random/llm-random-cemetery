# h12_chinchilla with the attention output gate (arXiv 2505.06708), FLOPs-matched to it.
defaults:
  - ../h12_chinchilla@_global_
  - _self_

common:
  attention:
    output_gate: true

trainer:
  # 50_000 * 854_654_976 / 897_122_304 FLOPs/token (mfu.py; the gate adds 4.97%) = 47_633, to a multiple of 10
  n_steps: 47_630

infrastructure:
  metric_logger:
    name: h12_output_gate
    tags:
      - nano
      - h12
      - chinchilla
      - wsd
      - qk_norm
      - bs64
      - output_gate
