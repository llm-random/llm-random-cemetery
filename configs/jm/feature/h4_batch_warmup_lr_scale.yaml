# h4_remote_test with and without the ramp's LR scale (x1/2 at batch 64, x1/sqrt(2) at 128), on lem, no downstream eval: ~15 min.
defaults:
  - ../h4_remote_test@_global_
  # lem over h4_remote_test's entropy: entropy's h100 queue was full on 2026-11-17
  - ../../_cluster/lem@_global_
  - _self_

trainer:
  batch_size_warmup:
    ^scale_lr: [false, true]

downstream_evaluator:
  eval_interval: 0
  final_eval: false

infrastructure:
  metric_logger:
    name: h4_batch_warmup_lr_scale
    tags:
      - nano
      - h4
      - remote_test
      - batch_warmup_lr_scale

  # lem's cluster file sets these too; h4_remote_test's values again
  slurm:
    time: "00:30:00"
    gres: gpu:hopper:2
    job-name: ${infrastructure.metric_logger.name}
