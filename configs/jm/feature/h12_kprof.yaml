# h12_chinchilla for 100 steps with the per-kernel dump at steps 12-13; the QK-norm-off half of the pair.
defaults:
  - ../h12_chinchilla@_global_
  - _self_

trainer:
  n_steps: 100
  kernel_profile: true
  # section: ranges, so scripts/kprof_ops.py can split forward from backward
  profile_timers: true
  scheduler:
    # pinned: 1%/10% of 100 steps would jump straight to the peak LR
    warmup_steps: 50
    decay_steps: 10
  checkpoint:
    save:
      interval: -1
      path: null

downstream_evaluator:
  eval_interval: 0
  final_eval: false

infrastructure:
  metric_logger:
    name: h12_kprof
    # no lr_tune/chinchilla tags: lr_plots and collect_checkpoints select runs by tag
    tags:
      - nano
      - h12
      - kprof

  slurm:
    # ~4 min to step 1 (compile included) + ~40 s of steps
    time: "00:15:00"
