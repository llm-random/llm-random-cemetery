# tiny_local with muP for Muon. Run: pixi run python main.py --config-path configs/jm/feature --config-name tiny_local_muon_mup
defaults:
  - ../../tiny_local@_global_
  - override ../../_trainer/_optimizer@optimizer: muon_mup
  - _self_

optimizer:
  # base h2, so m = 2 at h4; at the default base h4 every multiplier would be 1
  base_dmodel: 128

infrastructure:
  metric_logger:
    type: stdout
