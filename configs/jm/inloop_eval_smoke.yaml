# Temporary: 4-GPU smoke test of in-loop downstream eval on h16_chinchilla.
# Rerun to check DISABLE_MULTIPROC: rank 0's eval wall time should drop from ~143 s to ~18 s.
defaults:
  - h16_chinchilla
  - ../_downstream_eval@_here_: joint
  - _self_

trainer:
  n_steps: 301
  checkpoint:
    save:
      # Lands on the eval steps, to check the save runs first; scratch, delete afterwards.
      interval: 100
      path: ${oc.env:PROJECT_HOME_PATH,/storage_nvme_4/nano/pretraining}/${oc.env:USER}/checkpoints/inloop_eval_smoke

downstream_evaluator:
  # All nine joint tasks, capped per task.
  limit: 50
  eval_interval: 100
  final_eval: true

infrastructure:
  metric_logger:
    name: inloop_eval_smoke
    tags:
      - nano
      - remote
      - h16
      - smoke
      - inloop_eval

  slurm:
    time: "00:45:00"
