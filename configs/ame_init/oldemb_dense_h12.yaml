# AME init follow-up (documents/notes/ame_init_embed_ablation.md), step 1, run
# oldemb_dense_h12: S1-D, the dense h12 baseline (GQA with RoPE, no KV shift), 4B
# tokens, n = 8, under the new init defaults of branch ame_initialization except
# the embedding. The head is Xavier, and the Linears pkmf's sqrt(0.1 / fan_in); the
# embedding is not decayed. The embedding draw is the old one, a cut N(0, 1) (the
# model: block below).
#
# A copy of configs/ame_init/dense_h12.yaml (itself configs/stage_1/
# dense_h12_lr_grid.yaml with the grid replaced by learning_rate: 8) with that block
# added and the names changed. References: x0xlqroj (old init, n = 8), final_ce
# 2.9824, and 355fr6rn (the new init, Xavier embedding), 4.2188. No /base_schema, as
# in the copied file; run_exp.py checks the composed config against the schema
# (check_point). Node r16-11 is excluded at submit with
# +infrastructure.slurm.exclude=r16-11.
defaults:
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128; kept equal to the AME arms
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # The arm: dense attention with RoPE (base 10000), the h_balanced default.
  attention:
    type: gqa

model:
  embedding:
    # The one change from dense_h12.yaml: the old embedding draw, N(0, 1) cut at
    # +-2 (std 0.88), as ame_main's base.yaml. The head and Linears keep the new
    # init, and the embedding stays undecayed: on this branch that exemption is a
    # code attribute (TransformerEmbedding.no_weight_decay_parameters), not an init.
    init_fn:
      _target_: src.core.model.trunc_normal_
      _partial_: true

compile_blocks_full: true

trainer:
  # As S1-D: micro-batch 32 x 16, FSDP2 off, autocast bf16.
  gradient_accumulation_steps: 16 # micro-batch 32
  mem_parallel_size: null # dense attention has no banks
  distributed: null
  autocast_bf16: true # bf16 now comes from autocast instead of FSDP2

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1 (on this branch, not on the token embedding);
  #   - cosine schedule, warmup 1% = 38 steps, final LR 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 3815 # D = 4B tokens / 1,048,576 tokens per step
  learning_rate: 8 # n = 8, LR = 2^-8, as x0xlqroj
  checkpoint:
    save:
      # Only the final checkpoint is written (interval -1). It lands in the
      # job's cemetery clone, under checkpoint/<job id>/0/, at ~2 GB.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:hopper:1
    job-name: ame_init_oldemb_dense_h12
    time: "0-05:00:00"
  metric_logger:
    project_name: nano-ame
    name: ame_init_oldemb_dense_h12
    tags:
      - dense
      - h12
      - ame_init
      - ame_init_oldemb
      - ame_init_oldemb_dense_h12
