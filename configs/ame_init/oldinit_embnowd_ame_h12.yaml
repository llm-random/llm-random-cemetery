# AME init follow-up (documents/notes/ame_init_embed_ablation.md), step 1's extra
# arm, run oldinit_embnowd_ame_h12: S2-PS, AME with the KV shift and ALiBi, h12, 4B
# tokens, n = 8, under the OLD init everywhere (stage 1-2's) with one change from
# the reference doi36p8k: the embedding is not decayed. On this branch that is the
# default (TransformerEmbedding.no_weight_decay_parameters); on ame_main, where
# doi36p8k ran, the embedding was decayed at 0.1. The banks are undecayed in both.
#
# A copy of oldemb_ame_h12.yaml (ame_h12.yaml with the old embedding draw) with the
# old init also restored for the Linears, the head and the banks (the model: block
# and bank_init_std below), and the names changed. Reference: doi36p8k (old init,
# embedding decayed, n = 8), final_ce 3.1250. Node r16-11 is excluded at submit with
# +infrastructure.slurm.exclude=r16-11.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128, so flex blocks align
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # S2-PS: the implemented ALiBi ladder and the KV shift.
  attention:
    type: ame
    ame:
      shift: true
      bank_init_std: 1.0 # the old banks, N(0, 1); this branch's default is Xavier

model:
  # The old init, as ame_main's configs/_model/h_balanced/base.yaml, restored key by
  # key over this branch's defaults. Only the embedding's decay differs from it.
  embedding:
    init_fn: # N(0, 1), cut at +-2 (std 0.88)
      _target_: src.core.model.trunc_normal_
      _partial_: true
  encoder:
    block_fn:
      attention_fn:
        init_scale: 1 # std 1 / sqrt(fan_in), cut at +-2 std
      ff_layer_fn:
        ff_pre_act_fn: # gate_fn interpolates this one, so it follows
          partial_init_fn:
            scale: 1
        ff_post_act_fn:
          partial_init_fn:
            scale: 1
  head:
    linear_fn:
      partial_init_fn:
        _target_: src.core.model.llm_random_weight_init
        _partial_: true
        scale: 1

compile_blocks_full: true

trainer:
  # As S2-PS: micro-batch 32 x 16, Tier 2 banks (fp32 master, bf16 forward copy),
  # no FSDP2 so AME's readouts are logged, autocast bf16.
  gradient_accumulation_steps: 16
  mem_parallel_size: 1
  distributed: null
  autocast_bf16: true

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1 (the AME banks and scalars and, on this branch,
  #     the token embedding are exempt);
  #   - cosine schedule to 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 3815 # D = 4B tokens / 1,048,576 tokens per step
  learning_rate: 8 # n = 8, LR = 2^-8, as doi36p8k
  scheduler:
    warmup_steps: 38
  count_token_updates: true
  checkpoint:
    save:
      # Only the final checkpoint (interval -1), in the job's cemetery clone under
      # checkpoint/<job id>/0/step_3814/, with token_counts.pt beside it.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:hopper:1
    job-name: ame_init_oldinit_embnowd_ame_h12
    time: "0-07:00:00"
  metric_logger:
    project_name: nano-ame
    name: ame_init_oldinit_embnowd_ame_h12
    tags:
      - ame
      - h12
      - ame_init
      - ame_init_oldinit_embnowd
      - ame_init_oldinit_embnowd_ame_h12
