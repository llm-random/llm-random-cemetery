# AME init experiment (documents/notes/ame_init_exp.md), run ame_h16: S2b-PS h16,
# AME with the KV shift and ALiBi, 8B tokens, n = 8, under the new init defaults
# of branch ame_initialization (Xavier embedding, head and banks; pkmf's
# sqrt(0.1 / fan_in) Linears; no weight decay on the embedding or the banks).
#
# A copy of configs/bank_gates/h16_base.yaml, the config that composes S2b-PS h16
# exactly as W&B hjw7znbz ran it, with only the names changed. The init comes
# from the branch defaults, so nothing here sets one. Reference: hjw7znbz,
# final_ce 2.8594. Node r16-11 is excluded at submit with
# +infrastructure.slurm.exclude=r16-11.
defaults:
  - /base_schema
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h16
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128, so flex blocks align
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # S2b-PS: the implemented ALiBi ladder and the KV shift.
  attention:
    type: ame
    ame:
      shift: true

compile_blocks_full: true

trainer:
  # As S2b-PS h16: micro-batch 16 (AME h16 runs out of memory at 32), Tier 2
  # banks (fp32 master, bf16 forward copy), no FSDP2 so AME's readouts are
  # logged, autocast bf16.
  gradient_accumulation_steps: 32
  mem_parallel_size: 1
  distributed: null
  autocast_bf16: true

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1 (the AME banks and scalars and, on this branch,
  #     the token embedding are exempt);
  #   - cosine schedule to 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 7630 # D = 8B tokens / 1,048,576 tokens per step, rounded up
  learning_rate: 8 # n = 8, LR = 2^-8, as hjw7znbz
  scheduler:
    warmup_steps: 76
  count_token_updates: true
  checkpoint:
    save:
      # Only the final checkpoint (interval -1), in the job's cemetery clone under
      # checkpoint/<job id>/0/step_7629/, with token_counts.pt beside it. About
      # 23 GB per checkpoint.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:hopper:1
    job-name: ame_init_ame_h16
    time: "1-00:00:00" # hjw7znbz took 15 h 06 min
  metric_logger:
    project_name: nano-ame
    name: ame_init_ame_h16
    tags:
      - ame
      - h16
      - ame_init
      - ame_init_ame_h16
