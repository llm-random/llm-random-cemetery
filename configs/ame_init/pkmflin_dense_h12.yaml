# AME init follow-up (documents/notes/ame_init_pkmf_linears.md), run
# pkmflin_dense_h12: S1-D, the dense h12 baseline (GQA with RoPE, no KV shift), 4B
# tokens, n = 8. W&B x0xlqroj with one change: the Linears and the head start at
# pkmf's scale, std sqrt(0.1 / fan_in) cut at +-2 std, instead of 1 / sqrt(fan_in)
# cut at +-2 std. Every init is written out below, so this branch's defaults do not
# reach the run:
#   - embedding: N(0, 1) cut at +-2 (std 0.88), decayed at 0.1, as x0xlqroj;
#   - attention Q, K, V and O, the three FF Linears and the head:
#     sqrt(0.1 / fan_in), cut at +-2 std.
#
# A copy of oldinit_embnowd_dense_h12.yaml (the old init everywhere) with the model
# block below and the names changed. Reference: x0xlqroj (old init, n = 8),
# final_ce 2.9824.
# Runs on entropy (h100a, one H100), moved from LEM on 2026-11-10 at Maciej's
# request: entropy's FineWeb copy is LEM's (ame_efficiency_parity_report.md, item 6).
defaults:
  - ../_misc@_here_: default
  - ../_cluster@_here_: entropy
  - ../_model/h_balanced@_here_: h12
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128; kept equal to the AME arms
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # The arm: dense attention with RoPE (base 10000), the h_balanced default.
  attention:
    type: gqa

model:
  embedding:
    init_fn: # N(0, 1), cut at +-2 (std 0.88), as x0xlqroj
      _target_: src.core.model.trunc_normal_
      _partial_: true
    weight_decay: true # decayed at 0.1, as x0xlqroj; this branch's default exempts it
  encoder:
    block_fn:
      attention_fn:
        init_scale: ${eval:'0.1 ** 0.5'} # Q, K, V, O: std sqrt(0.1 / fan_in), cut at +-2 std
      ff_layer_fn:
        ff_pre_act_fn: # gate_fn interpolates this one, so it follows
          partial_init_fn:
            scale: ${eval:'0.1 ** 0.5'}
        ff_post_act_fn:
          partial_init_fn:
            scale: ${eval:'0.1 ** 0.5'}
  head:
    linear_fn:
      partial_init_fn: # std sqrt(0.1 / 768) = 0.0114, cut at +-2 std
        _target_: src.core.model.llm_random_weight_init
        _partial_: true
        scale: ${eval:'0.1 ** 0.5'}

compile_blocks_full: true

trainer:
  # As S1-D: micro-batch 32 x 16, FSDP2 off, autocast bf16.
  gradient_accumulation_steps: 16 # micro-batch 32
  mem_parallel_size: null # dense attention has no banks
  distributed: null
  autocast_bf16: true # bf16 now comes from autocast instead of FSDP2

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1 on every parameter (the token embedding included,
  #     model.embedding.weight_decay above), one group as in x0xlqroj;
  #   - cosine schedule, warmup 1% = 38 steps, final LR 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 3815 # D = 4B tokens / 1,048,576 tokens per step
  learning_rate: 8 # n = 8, LR = 2^-8, as x0xlqroj
  checkpoint:
    save:
      # Only the final checkpoint is written (interval -1). It lands in the
      # job's cemetery clone, under checkpoint/<job id>/0/, at ~2 GB.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:h100:1
    job-name: ame_init_pkmflin_dense_h12
    time: "0-05:00:00"
  metric_logger:
    project_name: nano-ame
    name: ame_init_pkmflin_dense_h12
    tags:
      - dense
      - h12
      - ame_init
      - ame_init_pkmflin
      - ame_init_pkmflin_dense_h12
