# AME init experiment (documents/notes/ame_init_exp.md), run dense_h16: S1b-D, the
# dense h16 baseline (GQA with RoPE, no KV shift), 8B tokens, n = 9, under the
# new init defaults of branch ame_initialization (Xavier embedding and head;
# pkmf's sqrt(0.1 / fan_in) Linears; no weight decay on the embedding).
#
# A copy of configs/stage_1b/dense_h16_lr_grid.yaml with the grid replaced by
# learning_rate: 9 and only the names changed. The init comes from the branch
# defaults, so nothing here sets one. Reference: eh2sjsh7 (n = 9), final_ce
# 2.7441. No /base_schema, as in the copied file; run_exp.py checks the composed
# config against the schema (check_point). Node r16-11 is excluded at submit with
# +infrastructure.slurm.exclude=r16-11.
defaults:
  - ../_misc@_here_: default
  - ../_cluster@_here_: lem
  - ../_model/h_balanced@_here_: h16
  - ../_trainer@_here_: llama
  - ../_dataset@_here_: fineweb
  - ../_checkpoints@_here_: none # save.path below switches on the final checkpoint
  - _self_

common:
  sequence_length: 2049 # the model sees 2048 = 16 x 128; kept equal to the AME arms
  batch_size: 512 # sequences per optimizer step = 1,048,576 tokens
  # The arm: dense attention with RoPE (base 10000), the h_balanced default.
  attention:
    type: gqa

compile_blocks_full: true

trainer:
  # As S1b-D: micro-batch 16 x 32, as in the AME arms; FSDP2 off, autocast bf16.
  gradient_accumulation_steps: 32 # micro-batch 16
  mem_parallel_size: null # dense attention has no banks
  distributed: null
  autocast_bf16: true # bf16 comes from autocast instead of FSDP2

  # The recipe. Everything not set here is a llama-trainer default:
  #   - AdamW, weight decay 0.1 (on this branch, not on the token embedding);
  #   - cosine schedule, warmup 1% = 76 steps, final LR 10% of peak;
  #   - eval every 100 steps on 10 batches;
  #   - final_ce on the fixed held-out set: 8192 samples x 2048 tokens.
  n_steps: 7630 # D = 8B tokens / 1,048,576 tokens per step, rounded up
  learning_rate: 9 # n = 9, LR = 2^-9, as eh2sjsh7
  checkpoint:
    save:
      # Only the final checkpoint is written (interval -1). It lands in the
      # job's cemetery clone, under checkpoint/<job id>/0/, at about 4 GB.
      path: checkpoint

infrastructure:
  slurm:
    gres: gpu:hopper:1
    job-name: ame_init_dense_h16
    time: "1-00:00:00" # eh2sjsh7 took about 12.6 h
  metric_logger:
    project_name: nano-ame
    name: ame_init_dense_h16
    tags:
      - dense
      - h16
      - ame_init
      - ame_init_dense_h16
