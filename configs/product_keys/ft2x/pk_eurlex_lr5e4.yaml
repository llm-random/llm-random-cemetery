# @package _global_
# ft2 extension (2026-11-19): EUR-Lex best LR was the grid maximum (2e-4) with val still rising -> add 5e-4.
# Same as ft2/pk_eurlex (both padding modes) except the LR. Same W&B name and tags (+ ft2_lr_ext).
defaults:
  - /product_keys/ft2/pk_eurlex@_here_
  - _self_

trainer:
  learning_rate: 5e-4
  ^learning_rate: [5e-4]

infrastructure:
  metric_logger:
    tags:
      - nano
      - finetuning
      - ft2
      - ft2_lr_ext
      - 2026.11.19
      - task=eurlex
      - model=pk
      - ckpt_job=6341320
      - lr=${trainer.learning_rate}
      - seed=${trainer.train_dataloader.dataset.seed}
      - padding_mask_mode=${model.encoder.block_fn.attention_fn.padding_mask_mode}
