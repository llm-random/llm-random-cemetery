_run_: true
checkpoint_config:
  slurm_array_task_id: 0
cluster_switch:
  eval_path_c4: /storage_nvme_1/llm-random/datasets/c4/validation
  eval_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train
  train_path_c4: /storage_nvme_1/llm-random/datasets/c4/train
  train_path_fineweb: /storage_nvme_4/llm-random/datasets/fineweb/train
common:
  _target_: src.definitions.Common
  batch_size: 2
  datt: 64
  dff: 256
  dmodel: 64
  head_norm: true
  init_scale: 0.1
  init_type: truncated_normal_fixed
  kv_heads: 2
  model_type: gpt
  n_blocks: 4
  q_heads: 4
  sequence_length: 16
  vocab_size: 128256
evaluator: null
infrastructure:
  cemetery_experiments_dir: ~/llmrandom_cemetery
  generated_configs_path: generated_configs
  git:
    remote_name: cemetery
    remote_url: git@github.com:llm-random/llm-random-cemetery.git
  max_concurrent_jobs: 1
  metric_logger:
    heavy_metrics_calculation_interval: 100
    name: test_decay
    new_wandb_job: true
    project_name: llm-random-test
    tags:
    - nano
    - remote
    - tiny
    - test_decay_local
    type: wandb
    wandb_entity: ideas_cv
  script:
  - 'export WANDB_API_KEY="__WANDB_API_KEY_PLACEHOLDER__"

    export HF_TOKEN="__HF_TOKEN_PLACEHOLDER__"'
  - export PROJECT_HOME_PATH=/storage_nvme_4/nano
  - export HF_HOME=$PROJECT_HOME_PATH/hf_cache
  - export HYDRA_FULL_ERROR=1
  - export PIXI_HOME=$PROJECT_HOME_PATH/$USER/pixi
  - export PATH="$HOME/.pixi/bin:$PATH"
  - export XDG_DATA_HOME="$PIXI_HOME/data"
  - export XDG_CACHE_HOME="$PIXI_HOME/cache"
  - export XDG_STATE_HOME="$PIXI_HOME/state"
  - cd "$PIXI_HOME"
  - eval "$(pixi shell-hook)"
  - cd -
  server: entropy
  slurm:
    cpus_per_gpu: 14
    gres: gpu:1
    job-name: test_decay
    mem_per_gpu: 90G
    nodes: 1
    partition: h100
    time: 00:10:00
model:
  _target_: src.projected_compression.model.LLM
  embedding:
    _target_: src.projected_compression.model.TransformerEmbedding
    dmodel: 64
    init_fn:
      _partial_: true
      _target_: src.projected_compression.model.trunc_normal_
    vocab_size: 128256
  encoder:
    _target_: src.projected_compression.model.TransformerEncoder
    block_fn:
      _partial_: true
      _target_: src.projected_compression.model.TransformerBlock
      attention_fn:
        _partial_: true
        _target_: src.projected_compression.model.RoPEAttention
        dmodel: 64
        k_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 64
          out_features: 32
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        kv_heads: 2
        o_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 64
          out_features: 64
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        q_heads: 4
        q_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 64
          out_features: 64
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        rope_base: 500000
        rope_scale_freqs: true
        seq_len: 16
        v_proj_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 64
          out_features: 32
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
      ff_layer_fn:
        _partial_: true
        _target_: src.projected_compression.model.ProjectedLlamaFeedForward
        ff_post_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 256
          out_features: 64
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        ff_pre_act_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 64
          out_features: 256
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
        gate_fn:
          _partial_: true
          _target_: src.projected_compression.model.Linear
          in_features: 64
          out_features: 256
          partial_init_fn:
            _partial_: true
            _target_: src.projected_compression.model.llm_random_weight_init
            scale: 1
      norm_fn:
        _partial_: true
        _target_: src.core.model.RMSNorm
        eps: 1.0e-05
        normalized_shape: 64
    n_blocks: 4
  head:
    _target_: src.projected_compression.model.TransformerHead
    linear_fn:
      _partial_: true
      _target_: src.projected_compression.model.Linear
      in_features: 64
      out_features: 128256
      partial_init_fn:
        _partial_: true
        _target_: src.projected_compression.model.llm_random_weight_init
        scale: 1
    norm_fn:
      _partial_: true
      _target_: src.core.model.RMSNorm
      eps: 1.0e-05
      normalized_shape: 64
overrides: []
trainer:
  _partial_: true
  _target_: src.core.trainer.Trainer
  checkpoint:
    load:
      model_checkpoint_filename: __model_checkpoint_filename.pt
      only_weights: true
      path: null
      training_state_filename: null
      type: nano
    save:
      interval: 200
      model_checkpoint_filename: __model_checkpoint_filename.pt
      path: test_decay_ckpts
      training_state_filename: __training_state_filename.pt
      type: nano
  distributed:
    fsdp2:
      modules_to_shard:
      - src.projected_compression.model.TransformerEmbedding
      - src.projected_compression.model.TransformerBlock
      - src.projected_compression.model.TransformerHead
  eval_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.C4Dataset
      path: /storage_nvme_1/llm-random/datasets/c4/validation
      seed: 123
      sequence_length: 16
      shuffle: true
      split: validation
      tokenize_fn:
        _target_: src.core.datasets.llama_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 8
    total_batch_size: 2
  eval_interval: 100
  gradient_accumulation_steps: 1
  gradient_clipping: 1
  learning_rate: 0.001
  n_eval_steps: 10
  n_steps: 1001
  scheduler:
    _partial_: true
    _target_: src.core.schedulers.get_cosine_scheduler_with_warmup
    final_lr_fraction: 0.1
    warmup_steps: 10
  train_dataloader:
    _target_: src.core.datasets.get_dataloader
    dataset:
      _target_: src.core.datasets.C4Dataset
      path: /storage_nvme_1/llm-random/datasets/c4/train
      seed: 123
      sequence_length: 16
      shuffle: true
      split: train
      tokenize_fn:
        _target_: src.core.datasets.llama_tokenize_fn
      use_new_sampling_method: true
      world_size_independent: false
    num_workers: 8
    total_batch_size: 2
  weight_decay: 0.1
